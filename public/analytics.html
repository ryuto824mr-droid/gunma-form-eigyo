<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>分析 - LOCLE営業ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-500: #44B13F; --green-700: #2F8A2A;
    --green-50: #f0faf0;  --green-100: #d8f0d8;
    --gray-50: #f8fafc;   --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;  --gray-300: #cbd5e1;
    --gray-400: #94a3b8;  --gray-500: #64748b;
    --gray-700: #334155;  --gray-900: #0f172a;
    --white: #ffffff;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
    --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", "Noto Sans JP", sans-serif; background: var(--gray-50); margin: 0; color: var(--gray-900); }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .container { animation: fadeInUp 0.4s ease-out; }

  .page-header {
    background: linear-gradient(135deg, #2F8A2A 0%, #44B13F 50%, #5BC952 100%);
    border-bottom: none; box-shadow: 0 2px 8px rgba(47,138,42,0.3);
    padding: 0 24px; display: flex; align-items: center; gap: 16px;
    height: 56px; position: sticky; top: 0; z-index: 100;
  }
  .page-header h1 {
    margin: 0; font-size: 15px; font-weight: 700; color: var(--white);
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  }
  .page-header h1 svg { width: 18px; height: 18px; }
  .page-nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
  .page-nav a {
    color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 500;
    text-decoration: none; white-space: nowrap;
    padding: 6px 10px; border-radius: var(--radius-sm); transition: all 150ms;
  }
  .page-nav a:hover { color: white; background: rgba(255,255,255,0.15); }
  .page-nav a.active {
    color: white; font-weight: 600;
    background: rgba(255,255,255,0.15); border-bottom: 2px solid white; padding-bottom: 4px;
  }

  .container { max-width: 960px; margin: 0 auto; padding: 28px 16px; }

  .analytics-header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .updated-at { font-size: 12px; color: var(--gray-400); flex: 1; }
  .btn-refresh, .btn-check {
    padding: 7px 14px; font-size: 13px; border-radius: var(--radius-sm);
    cursor: pointer; font-family: inherit; font-weight: 600;
    transition: all 150ms ease; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-refresh svg, .btn-check svg { width: 14px; height: 14px; }
  .btn-refresh { border: 1px solid var(--gray-200); color: var(--gray-700); background: var(--white); }
  .btn-refresh:hover { background: var(--gray-50); transform: translateY(-1px); }
  .btn-check  { border: 1px solid #a5b4fc; color: #4338ca; background: var(--white); }
  .btn-check:hover:not(:disabled) { background: #eef2ff; transform: translateY(-1px); }
  .btn-check:disabled { border-color: var(--gray-200); color: var(--gray-400); cursor: not-allowed; }
  .check-msg { font-size: 12px; color: var(--gray-500); }

  /* Summary cards */
  .summary-cards { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .summary-card {
    flex: 1; min-width: 140px; background: var(--white);
    border: 1px solid var(--gray-200); border-radius: var(--radius-lg);
    padding: 20px 24px; box-shadow: var(--shadow-sm); text-align: center;
    position: relative; overflow: hidden;
    transition: transform 200ms ease, box-shadow 200ms ease;
  }
  .summary-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #44B13F, #5BC952);
  }
  .summary-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .card-icon {
    display: block; width: 26px; height: 26px;
    color: var(--green-500); margin: 0 auto 10px;
  }
  .summary-card .card-label {
    font-size: 11px; color: var(--gray-400); margin-bottom: 10px;
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  .summary-card .card-value {
    font-size: 32px; font-weight: 700; color: var(--green-700);
    line-height: 1; letter-spacing: -0.03em;
  }
  .summary-card .card-unit { font-size: 14px; font-weight: 400; color: var(--gray-400); margin-left: 3px; }

  /* Empty state */
  .empty-state {
    background: var(--white); border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg); padding: 56px 24px;
    text-align: center; color: var(--gray-400); font-size: 14px;
    box-shadow: var(--shadow-sm); margin-bottom: 24px;
  }

  .stat-section {
    background: var(--white); border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg); padding: 24px;
    margin-bottom: 20px; box-shadow: var(--shadow-sm);
  }
  .stat-section h2 { margin: 0 0 18px; font-size: 14px; font-weight: 600; color: var(--gray-700); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    background: var(--gray-50); text-align: left; padding: 10px 14px;
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--gray-500);
    border-bottom: 2px solid var(--gray-200); white-space: nowrap;
  }
  td { padding: 12px 14px; border-bottom: 1px solid var(--gray-100); color: var(--gray-700); }
  th.r, td.r { text-align: right; }
  tr:hover td { background: var(--green-50); transition: background 100ms ease; }
  .rate-hi { color: var(--green-700); font-weight: 600; }
  .rate-lo { color: var(--gray-300); }
  .dash    { color: var(--gray-300); }
  .empty   { font-size: 13px; color: var(--gray-400); padding: 16px 0; margin: 0; }

  .rate-bar  { display: inline-block; vertical-align: middle; width: 72px; height: 6px; background: var(--gray-200); border-radius: 999px; margin-left: 8px; }
  .rate-fill { height: 100%; background: var(--green-500); border-radius: 999px; transition: width 600ms cubic-bezier(0.4,0,0.2,1); }

  /* Tooltip */
  .tooltip-wrap { position: relative; display: inline-block; }
  .tooltip-wrap .tooltip-text {
    visibility: hidden; opacity: 0;
    background: var(--gray-900); color: white;
    font-size: 11px; padding: 4px 8px; border-radius: 4px;
    position: absolute; bottom: calc(100% + 6px); left: 50%;
    transform: translateX(-50%); white-space: nowrap;
    transition: opacity 150ms; z-index: 100; pointer-events: none;
  }
  .tooltip-wrap:hover .tooltip-text { visibility: visible; opacity: 1; }

  /* Spotlight Tour */
  .tour-overlay {
    position: fixed;
    inset: 0;
    z-index: 9998;
    background: transparent;
  }
  .tour-highlight {
    position: relative;
    z-index: 9999 !important;
    box-shadow: 0 0 0 4px var(--green-500), 0 0 0 9999px rgba(0,0,0,0.5) !important;
    border-radius: 8px;
    transition: box-shadow 0.3s ease;
  }
  .tour-bubble {
    position: fixed;
    z-index: 10000;
    background: white;
    border-radius: 12px;
    padding: 20px 24px;
    min-width: 280px;
    max-width: 340px;
    width: calc(100vw - 32px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    animation: tourFadeInUp 0.3s ease;
  }
  @keyframes tourFadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .tour-bubble::before {
    content: "";
    position: absolute;
    width: 0; height: 0;
    border: 8px solid transparent;
  }
  .tour-bubble.pos-bottom::before { top: -16px; left: 24px; border-bottom-color: white; }
  .tour-bubble.pos-top::before    { bottom: -16px; left: 24px; border-top-color: white; }
  .tour-bubble.pos-center::before { display: none; }
  .tour-bubble-dots { display: flex; gap: 6px; margin: 0 0 12px; }
  .tour-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gray-200); transition: all 0.2s ease; }
  .tour-dot.active { background: var(--green-500); width: 16px; border-radius: 3px; }
  .tour-bubble-title { font-size: 15px; font-weight: 700; color: var(--green-700); margin: 0 0 8px; }
  .tour-bubble-desc  { font-size: 13px; color: var(--gray-500); line-height: 1.7; margin: 0 0 16px; }
  .tour-bubble-nav   { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tour-bubble-counter { font-size: 11px; color: var(--gray-400); font-weight: 600; }
  .btn-tskip {
    padding: 6px 12px; font-size: 12px; border: 1px solid var(--gray-200);
    background: white; color: var(--gray-500); border-radius: var(--radius-sm);
    cursor: pointer; font-family: inherit;
  }
  .btn-tnext {
    padding: 10px 24px; font-size: 14px; font-weight: 600;
    background: linear-gradient(135deg, #44B13F, #2F8A2A);
    color: white; border: none; border-radius: var(--radius-sm);
    cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 8px rgba(68,177,63,0.3);
  }
  .btn-help-float {
    position: fixed; bottom: 24px; right: 24px; z-index: 500;
    padding: 10px 18px; font-size: 13px; font-weight: 600;
    background: white; color: var(--green-700);
    border: 2px solid var(--green-500); border-radius: 999px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    transition: all 150ms; display: flex; align-items: center; gap: 6px;
  }
  .btn-help-float:hover { background: var(--green-50); transform: translateY(-2px); }

  @media (max-width: 600px) {
    .page-header { padding: 0 12px; }
    .page-nav { overflow-x: auto; padding-bottom: 2px; }
    .container { padding: 16px 8px; }
    .summary-cards { flex-direction: column; }
    .summary-card { min-width: unset; }
    .btn-refresh, .btn-check { min-height: 44px; }
    .rate-bar { width: 48px; }
  }
</style>
</head>
<body>

<header class="page-header">
  <h1><a href="/index.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
    <img src="/logo.jpg" alt="LOCLE" style="height:28px; width:auto; object-fit:contain; background:white; padding:3px 8px; border-radius:6px;">
  </a></h1>
  <nav class="page-nav">
    <a href="/index.html">ホーム</a>
    <a href="/companies.html">企業リスト</a>
    <a href="/variants.html">メッセージ管理</a>
    <a href="/send.html">送信管理</a>
    <a href="/analytics.html" class="active">分析</a>
    <a href="/help.html">ヘルプ</a>
  </nav>
</header>

<div class="container">

  <div class="analytics-header">
    <span class="updated-at" id="updatedAt">読み込み中...</span>
    <span class="check-msg" id="checkMsg"></span>
    <span class="tooltip-wrap">
      <button class="btn-check" id="checkBtn" onclick="checkReplies()">
        <i data-lucide="mail-check"></i>返信チェック
      </button>
      <span class="tooltip-text">Gmailの未読メールを確認して返信を自動記録</span>
    </span>
    <button class="btn-refresh" onclick="loadAnalytics()">
      <i data-lucide="refresh-cw"></i>更新
    </button>
  </div>

  <div class="summary-cards" id="summaryCards"></div>
  <div id="mainContent"></div>

</div>

<button class="btn-help-float" id="helpFloatBtn">？ 使い方</button>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  function animateCount(el, target, isFloat = false) {
    const duration = 600;
    const start = performance.now();
    function step(now) {
      const t     = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      const cur   = target * eased;
      el.textContent = isFloat ? cur.toFixed(1) : Math.round(cur);
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  async function loadAnalytics() {
    document.getElementById("updatedAt").textContent = "読み込み中...";
    try {
      const res = await fetch("/api/analytics");
      if (!res.ok) throw new Error("取得失敗");
      const data = await res.json();

      const totalSends     = (data.variants_stats || []).reduce((s, r) => s + Number(r.send_count),     0);
      const totalResponses = (data.variants_stats || []).reduce((s, r) => s + Number(r.response_count), 0);
      const overallRate    = totalSends > 0 ? parseFloat((totalResponses / totalSends * 100).toFixed(1)) : 0;

      document.getElementById("summaryCards").innerHTML = renderSummaryCards(totalSends, totalResponses, overallRate);
      lucide.createIcons();

      // Count-up animation
      document.querySelectorAll(".count-num[data-target]").forEach(el => {
        animateCount(el, parseFloat(el.dataset.target), el.dataset.float === "true");
      });

      if (totalSends === 0) {
        document.getElementById("mainContent").innerHTML =
          '<div class="empty-state">まだ送信データがありません</div>';
      } else {
        document.getElementById("mainContent").innerHTML =
          `<section class="stat-section">
            <h2>バリアント別集計</h2>
            <div class="table-wrap">${renderVariantsTable(data.variants_stats)}</div>
          </section>
          <section class="stat-section">
            <h2>タグ別集計</h2>
            <div class="table-wrap">${renderTagsTable(data.tags_stats)}</div>
          </section>`;

        // Animate progress bars (width 0 → actual after repaint)
        requestAnimationFrame(() => requestAnimationFrame(() => {
          document.querySelectorAll(".rate-fill[data-width]").forEach(el => {
            el.style.width = el.dataset.width + "%";
          });
        }));
      }

      document.getElementById("updatedAt").textContent =
        `最終更新: ${new Date().toLocaleString("ja-JP")}`;
    } catch (err) {
      document.getElementById("mainContent").innerHTML =
        `<div class="empty-state">エラー: ${esc(err.message)}</div>`;
      document.getElementById("updatedAt").textContent = "取得失敗";
    }
  }

  function renderSummaryCards(totalSends, totalResponses, overallRate) {
    return `
      <div class="summary-card">
        <i data-lucide="send" class="card-icon"></i>
        <div class="card-label">総送信数</div>
        <div class="card-value">
          <span class="count-num" data-target="${totalSends}">0</span><span class="card-unit">件</span>
        </div>
      </div>
      <div class="summary-card">
        <i data-lucide="message-circle" class="card-icon"></i>
        <div class="card-label">総反応数</div>
        <div class="card-value">
          <span class="count-num" data-target="${totalResponses}">0</span><span class="card-unit">件</span>
        </div>
      </div>
      <div class="summary-card">
        <i data-lucide="trending-up" class="card-icon"></i>
        <div class="card-label">全体反応率</div>
        <div class="card-value">
          <span class="count-num" data-target="${overallRate}" data-float="true">0</span><span class="card-unit">%</span>
        </div>
      </div>`;
  }

  function renderVariantsTable(stats) {
    if (!stats || stats.length === 0) {
      return '<p class="empty">データがありません（送信を記録すると集計が表示されます）</p>';
    }
    const rows = stats.map(r => {
      const sends = Number(r.send_count);
      const rate  = Number(r.response_rate);
      const rc    = rate >= 20 ? "rate-hi" : (rate === 0 ? "rate-lo" : "");
      const dash  = sends === 0;
      return `
        <tr>
          <td>${esc(r.variant_name)}</td>
          <td class="r">${sends}</td>
          <td class="r">${dash ? '<span class="dash">—</span>' : r.response_count}</td>
          <td class="r">${dash ? '<span class="dash">—</span>' : r.interested_count}</td>
          <td class="r">
            ${dash
              ? '<span class="dash">—</span>'
              : `<span class="${rc}">${rate}%</span><span class="rate-bar"><span class="rate-fill" data-width="${Math.min(rate,100)}" style="width:0"></span></span>`
            }
          </td>
        </tr>`;
    }).join("");
    return `
      <table>
        <thead>
          <tr>
            <th>バリアント名</th>
            <th class="r">送信数</th>
            <th class="r">反応数</th>
            <th class="r">興味あり</th>
            <th class="r">反応率</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function renderTagsTable(stats) {
    if (!stats || stats.length === 0) {
      return '<p class="empty">タグがまだ設定されていません</p>';
    }
    const rows = stats.map(r => {
      const sends = Number(r.send_count);
      const rate  = Number(r.response_rate);
      const rc    = rate >= 20 ? "rate-hi" : (rate === 0 ? "rate-lo" : "");
      const dash  = sends === 0;
      return `
        <tr>
          <td>${esc(r.tag_key)}</td>
          <td>${esc(r.tag_value)}</td>
          <td class="r">${sends}</td>
          <td class="r">${dash ? '<span class="dash">—</span>' : r.response_count}</td>
          <td class="r">
            ${dash
              ? '<span class="dash">—</span>'
              : `<span class="${rc}">${rate}%</span><span class="rate-bar"><span class="rate-fill" data-width="${Math.min(rate,100)}" style="width:0"></span></span>`
            }
          </td>
        </tr>`;
    }).join("");
    return `
      <table>
        <thead>
          <tr>
            <th>タグキー</th><th>タグ値</th>
            <th class="r">送信数</th>
            <th class="r">反応数</th>
            <th class="r">反応率</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function esc(s) {
    return String(s || "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  async function checkReplies() {
    const btn   = document.getElementById("checkBtn");
    const msgEl = document.getElementById("checkMsg");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>チェック中...';
    msgEl.textContent = "";
    try {
      const res  = await fetch("/api/analytics?action=check-replies");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "失敗");
      msgEl.textContent =
        `${data.checked}件チェック、${data.matched}件一致、${data.recorded}件記録`;
      if (data.recorded > 0) loadAnalytics();
    } catch (err) {
      msgEl.textContent = `エラー: ${esc(err.message)}`;
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="mail-check"></i>返信チェック';
      lucide.createIcons();
    }
  }

  // ===== Spotlight Tour =====
  (function() {
    var _steps, _key, _idx, _bubble, _overlay;

    function _resolveEl(sel) {
      var parts = sel.split(",");
      for (var i = 0; i < parts.length; i++) {
        var el = document.querySelector(parts[i].trim());
        if (el) return el;
      }
      return null;
    }

    function _clearHighlight() {
      document.querySelectorAll(".tour-highlight").forEach(function(el) {
        el.classList.remove("tour-highlight");
      });
      if (_bubble && _bubble.parentNode) _bubble.parentNode.removeChild(_bubble);
      _bubble = null;
      if (_overlay && _overlay.parentNode) _overlay.parentNode.removeChild(_overlay);
      _overlay = null;
    }

    function _showStep(idx) {
      _clearHighlight();
      var s = _steps[idx];
      var total = _steps.length;
      var isLast = idx === total - 1;
      var target = _resolveEl(s.targetSelector);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });

      // オーバーレイはクリックをブロックするだけで、クリックしてもツアーは終了しない
      _overlay = document.createElement("div");
      _overlay.className = "tour-overlay";
      document.body.appendChild(_overlay);

      setTimeout(function() {
        if (target) target.classList.add("tour-highlight");

        var dots = "";
        for (var d = 0; d < total; d++) {
          dots += '<span class="tour-dot' + (d === idx ? ' active' : '') + '"></span>';
        }

        _bubble = document.createElement("div");
        _bubble.className = "tour-bubble pos-" + (s.position || "bottom");
        _bubble.innerHTML =
          '<div class="tour-bubble-dots">' + dots + '</div>' +
          '<p class="tour-bubble-title">' + s.title + '</p>' +
          '<p class="tour-bubble-desc">' + s.description + '</p>' +
          '<div class="tour-bubble-nav">' +
            '<button class="btn-tskip" id="_tskip">スキップ</button>' +
            '<span class="tour-bubble-counter">' + (idx + 1) + ' / ' + total + '</span>' +
            '<button class="btn-tnext" id="_tnext">' + (isLast ? 'はじめる ✓' : '次へ →') + '</button>' +
          '</div>';
        document.body.appendChild(_bubble);

        _bubble.querySelector("#_tskip").addEventListener("click", function() { _end(); });
        _bubble.querySelector("#_tnext").addEventListener("click", function() {
          if (idx < total - 1) _showStep(idx + 1); else _end();
        });

        if (s.position === "center" || !target) {
          _bubble.className = "tour-bubble pos-center";
          _bubble.style.top = "50%"; _bubble.style.left = "50%";
          _bubble.style.transform = "translate(-50%, -50%)";
        } else {
          var rect = target.getBoundingClientRect();
          var bw = _bubble.offsetWidth || 320;
          var bh = _bubble.offsetHeight || 160;
          var margin = 12;
          var pos = s.position || "bottom";

          if (pos === "bottom" && (rect.bottom + margin + bh > window.innerHeight - 20)) {
            pos = "top";
          }
          _bubble.className = "tour-bubble pos-" + pos;

          var left = Math.max(8, Math.min(rect.left, window.innerWidth - bw - 8));

          if (pos === "bottom") {
            _bubble.style.top = (rect.bottom + margin) + "px";
            _bubble.style.left = left + "px";
          } else if (pos === "top") {
            _bubble.style.left = left + "px";
            _bubble.style.top = Math.max(8, rect.top - bh - margin) + "px";
          } else if (pos === "right") {
            _bubble.style.top = rect.top + "px";
            _bubble.style.left = (rect.right + margin) + "px";
          } else if (pos === "left") {
            _bubble.style.top = rect.top + "px";
            _bubble.style.left = (rect.left - bw - margin) + "px";
          }
        }
      }, 500);
    }

    function _end() { _clearHighlight(); localStorage.setItem(_key, "1"); }

    function startTour(steps, storageKey) {
      _steps = steps; _key = storageKey; _idx = 0;
      if (!localStorage.getItem(_key)) _showStep(0);
    }

    document.getElementById("helpFloatBtn").addEventListener("click", function() {
      localStorage.removeItem(_key); _idx = 0; _showStep(0);
    });

    window.startTour = startTour;
  })();
  // ===== End Spotlight Tour =====

  lucide.createIcons();
  loadAnalytics();
  startTour([
    { targetSelector: "#summaryCards", title: "全体サマリー",          description: "総送信数・総反応数・全体反応率が確認できます。",                                                             position: "bottom" },
    { targetSelector: "#mainContent",  title: "バリアント別・タグ別集計", description: "どのバリアントが一番反応が良いかを比較できます。タグ別では文面の傾向ごとの反応率が分かります。",               position: "top" },
    { targetSelector: "#checkBtn",     title: "返信を自動取得",         description: "Gmailの未読メールを確認して、送信した企業からの返信を自動で記録します。毎日使う前に押すのがおすすめです。", position: "bottom" }
  ], "locle_tour_analytics");
</script>
