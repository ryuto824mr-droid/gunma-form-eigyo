<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>プロジェクトを選択 - LOCLE営業ツール</title>
<script>
  (function() {
    try {
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved ? saved === "dark" : prefersDark) document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>
<script src="/project-context.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --gray-50: #f8fafc;   --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;  --gray-300: #cbd5e1;
    --gray-400: #94a3b8;  --gray-500: #64748b;
    --gray-700: #334155;  --gray-900: #0f172a;
    --gray-900-rgb: 15,23,42;
    --white: #ffffff;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
    --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", "Noto Sans JP", sans-serif; background: var(--gray-50); margin: 0; color: var(--gray-900); line-height: 1.6; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .container { animation: fadeInUp 0.4s ease-out; }

  /* Header: プロジェクト未選択の状態なので、どちらのプロジェクトカラーにも
     染まらないニュートラルな配色にする */
  .page-header {
    background: linear-gradient(135deg, var(--gray-900) 0%, var(--gray-700) 100%);
    border-bottom: none; box-shadow: 0 2px 8px rgba(var(--gray-900-rgb), 0.3);
    padding: 0 24px; display: flex; align-items: center; gap: 16px;
    height: 56px; position: sticky; top: 0; z-index: 100;
  }
  .page-header h1 {
    margin: 0; font-size: 15px; font-weight: 600; color: var(--white);
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  }
  .page-nav { display: flex; gap: 2px; margin-left: auto; align-items: center; }
  .page-nav a {
    color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 500;
    text-decoration: none; white-space: nowrap;
    padding: 6px 10px; border-radius: var(--radius-sm); transition: all 150ms;
  }
  .page-nav a:hover { color: white; background: rgba(255,255,255,0.15); }
  .logo-img { background: white; padding: 3px 8px; }
  .page-nav a.active {
    color: white; font-weight: 600;
    background: rgba(255,255,255,0.15); border-bottom: 2px solid white; padding-bottom: 4px;
  }

  .container { max-width: 880px; margin: 0 auto; padding: 40px 16px; }

  /* Hero: ニュートラル(プロジェクトカラーに依存しない)デザイン */
  .hero {
    text-align: center; padding: 56px 24px 44px;
    background: linear-gradient(135deg, var(--gray-900) 0%, var(--gray-700) 55%, var(--gray-500) 100%);
    border-radius: var(--radius-lg);
    box-shadow: 0 4px 24px rgba(var(--gray-900-rgb), 0.35);
    margin-bottom: 32px;
  }
  .hero-logo {
    font-size: 56px; line-height: 1; margin-bottom: 10px;
  }
  .hero-subtitle {
    font-size: 22px; font-weight: 700; color: var(--white);
    margin-bottom: 14px; letter-spacing: -0.01em;
  }
  .hero-copy {
    font-size: 14px; color: rgba(255,255,255,0.78); line-height: 1.8;
    max-width: 480px; margin: 0 auto;
  }

  /* Project select */
  .project-select-section { margin-bottom: 12px; }
  .project-select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .project-select-grid { grid-template-columns: 1fr; } }
  .project-card {
    position: relative; background: var(--white); border: 2px solid var(--gray-200);
    border-radius: var(--radius-lg); padding: 20px; cursor: pointer; transition: all 150ms;
    box-shadow: var(--shadow-sm);
  }
  .project-card:hover { box-shadow: var(--shadow-md); border-color: var(--gray-300); transform: translateY(-2px); }
  .project-card-check {
    position: absolute; top: 14px; right: 14px; width: 22px; height: 22px; border-radius: 50%;
    color: white; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; opacity: 0; transition: opacity 150ms;
  }
  .project-card.selected .project-card-check { opacity: 1; }
  .project-card-icon {
    width: 44px; height: 44px; border-radius: var(--radius-md); display: flex; align-items: center;
    justify-content: center; font-size: 22px; margin-bottom: 12px;
  }
  .project-card-name { font-size: 16px; font-weight: 700; color: var(--gray-900); margin-bottom: 4px; }
  .project-card-desc { font-size: 13px; color: var(--gray-500); margin: 0 0 14px; line-height: 1.5; }
  .btn-project-goto {
    font-size: 12px; font-weight: 600; color: var(--gray-700); background: var(--gray-50);
    border: 1px solid var(--gray-200); border-radius: var(--radius-sm); padding: 7px 12px;
    cursor: pointer; font-family: inherit; transition: all 150ms;
  }
  .btn-project-goto:hover { background: var(--gray-100); }

  @media (max-width: 600px) {
    .page-header { padding: 0 12px; }
    .page-header h1 { font-size: 16px; }
    .btn-theme-toggle { width: 24px; height: 24px; font-size: 12px; }
    .container { padding: 20px 8px; }
    .hero { padding: 36px 16px 32px; }
    .hero-logo { font-size: 44px; }
  }

  /* Dark mode toggle */
  .btn-theme-toggle {
    background: rgba(255,255,255,0.15); border: none; color: white;
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    transition: background 150ms; flex-shrink: 0; margin-left: 6px;
  }
  .btn-theme-toggle:hover { background: rgba(255,255,255,0.28); }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    :root {
      --gray-50:  #0f172a;
      --gray-100: #1e293b;
      --gray-200: #334155;
      --gray-300: #475569;
      --gray-400: #64748b;
      --gray-500: #94a3b8;
      --gray-700: #cbd5e1;
      --gray-900: #f1f5f9;
      --white:    #1e293b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.22);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.26);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.4);
    }
    body { background: #0f172a; }
    .page-header { border-bottom-color: #334155; }
    .logo-img { background: rgba(255,255,255,0.08) !important; padding: 4px 10px; }
  }
  html.dark {
    --gray-50:  #0f172a;
    --gray-100: #1e293b;
    --gray-200: #334155;
    --gray-300: #475569;
    --gray-400: #64748b;
    --gray-500: #94a3b8;
    --gray-700: #cbd5e1;
    --gray-900: #f1f5f9;
    --white:    #1e293b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.22);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.26);
    --shadow-lg: 0 10px 15px rgba(0,0,0,0.4);
  }
  html.dark body { background: #0f172a; }
  html.dark .page-header { border-bottom-color: #334155; }
  html.dark .logo-img { background: rgba(255,255,255,0.08) !important; padding: 4px 10px; }
</style>
</head>
<body>

<header class="page-header">
  <h1><a href="/app.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
    <img src="/logo.jpg" alt="LOCLE" class="logo-img" id="headerLogo" style="height:28px; width:auto; object-fit:contain; border-radius:6px;">
  </a></h1>
  <nav class="page-nav">
    <a href="/app.html" class="active">ホーム</a>
    <button class="btn-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="ダークモード切替" title="ダークモード切替">🌙</button>
  </nav>
</header>

<div class="container">

  <section class="hero">
    <div class="hero-logo">🏢</div>
    <div class="hero-subtitle">営業自動化ツール</div>
    <p class="hero-copy">企業リサーチからフォーム送信・反応分析まで、営業活動を一気通貫で自動化します。<br>まずは利用するプロジェクトを選択してください。</p>
  </section>

  <section class="project-select-section" id="project-select">
    <p class="section-title" style="font-size:18px; font-weight:700; color:var(--gray-900); border-left:3px solid var(--gray-400); padding-left:12px; margin:0 0 16px;">プロジェクトを選択</p>
    <div class="project-select-grid">
      <div class="project-card" data-project="locle" id="projectCardLocle" onclick="goToHome('locle')">
        <span class="project-card-check" id="projectCheckLocle">✓</span>
        <div class="project-card-icon" style="background:#44B13F">
          <img src="/logo.jpg" alt="LOCLE" style="height:26px; width:auto; object-fit:contain; background:white; border-radius:4px; padding:2px 4px;">
        </div>
        <div class="project-card-name">LOCLE</div>
        <p class="project-card-desc">地域企業への採用・広報支援営業</p>
        <button type="button" class="btn-project-goto" onclick="event.stopPropagation(); goToHome('locle')">このプロジェクトを開く →</button>
      </div>
      <div class="project-card" data-project="ozukanzukan" id="projectCardOzukanzukan" onclick="goToHome('ozukanzukan')">
        <span class="project-card-check" id="projectCheckOzukanzukan">✓</span>
        <div class="project-card-icon" style="background:#f97316">
          <img src="/ozukanzukan-logo.png" alt="群馬お仕事図鑑" style="height:26px; width:auto; object-fit:contain; background:white; border-radius:4px; padding:2px 4px;">
        </div>
        <div class="project-card-name">群馬お仕事図鑑</div>
        <p class="project-card-desc">若手向け求人メディアの営業・運用</p>
        <button type="button" class="btn-project-goto" onclick="event.stopPropagation(); goToHome('ozukanzukan')">このプロジェクトを開く →</button>
      </div>
    </div>
  </section>

</div>

<script>
  // ===== Dark mode toggle =====
  function toggleTheme() {
    document.documentElement.classList.toggle("dark");
    const isDark = document.documentElement.classList.contains("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    updateThemeIcon();
  }

  function updateThemeIcon() {
    const btn = document.getElementById("themeToggleBtn");
    if (!btn) return;
    btn.textContent = document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
  }

  updateThemeIcon();

  // app.htmlは常にニュートラルな選択画面として振る舞うべきなので、
  // getCurrentProject()のようなURLパラメータ(?project=xxx)を読んで
  // localStorageへ自動保存する処理は使わない。ここではlocalStorageに
  // 保存済みの値だけを読み(URLパラメータの有無で挙動が変わらないようにする)、
  // 「前回選択したプロジェクト」のチェック表示にのみ使う。
  function getStoredProjectOnly() {
    try {
      var stored = localStorage.getItem(PROJECT_STORAGE_KEY);
      if (isValidProject(stored)) return stored;
    } catch (e) {}
    return null;
  }

  function renderProjectSelectUI() {
    var current = getStoredProjectOnly();

    // ヘッダーロゴも、URLパラメータではなくlocalStorageの保存値だけを見て切り替える
    // (前回選択したプロジェクトが無ければ、中立的なデフォルトのlogo.jpgのまま)
    var logoImg = document.getElementById("headerLogo");
    if (logoImg && current) {
      logoImg.src = getProjectLogo(current);
    }

    var map = { locle: "Locle", ozukanzukan: "Ozukanzukan" };
    Object.keys(map).forEach(function (project) {
      var card  = document.getElementById("projectCard" + map[project]);
      var check = document.getElementById("projectCheck" + map[project]);
      if (!card || !check) return;
      var isSelected = project === current;
      var color = getProjectColor(project);
      card.classList.toggle("selected", isSelected);
      card.style.borderColor = isSelected ? color : "";
      check.style.background = color;
    });
  }

  function goToHome(project) {
    setCurrentProject(project);
    window.location.href = addProjectParamToUrl("/home.html", project);
  }

  renderProjectSelectUI();
</script>
</body>
</html>
