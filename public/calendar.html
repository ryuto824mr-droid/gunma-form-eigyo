<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>カレンダー - LOCLE営業ツール</title>
<script>
  (function() {
    try {
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved ? saved === "dark" : prefersDark) document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>
<script src="/project-context.js"></script>
<!-- このページはLOCLE/群馬お仕事図鑑を横断して表示するため、他ページと違いapplyProjectTheme()は
     呼ばない(ヘッダーの配色を意図的にニュートラルなスレート色に固定している)。プロジェクトバッジ自体は
     project-context.jsのDOMContentLoaded自動初期化で表示される(情報表示のみで絞り込み用途ではない)。 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-900: #1a5c17; --green-800: #277025; --green-700: #2F8A2A; --green-600: #3da038;
    --green-500: #44B13F; --green-400: #5BC952; --green-300: #86efac;
    --green-200: #b7e4b0; --green-100: #d8f0d8; --green-50: #f0faf0;
    --green-500-rgb: 68,177,63; --green-700-rgb: 47,138,42; --green-900-rgb: 26,92,23;
    --gray-50: #f8fafc;   --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;  --gray-300: #cbd5e1;
    --gray-400: #94a3b8;  --gray-500: #64748b;
    --gray-700: #334155;  --gray-900: #0f172a;
    --white: #ffffff;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
    --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
    --slate-700-rgb: 51,65,85;
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", "Noto Sans JP", sans-serif; background: var(--gray-50); margin: 0; color: var(--gray-900); line-height: 1.6; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .container { animation: fadeInUp 0.4s ease-out; max-width: 1000px; margin: 0 auto; padding: 24px 16px; }

  /* ヘッダーはLOCLE(緑)/お仕事図鑑(オレンジ)どちらにも偏らないニュートラルなスレート配色に固定 */
  .page-header {
    background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
    border-bottom: none; box-shadow: 0 2px 8px rgba(var(--slate-700-rgb), 0.3);
    padding: 0 24px; display: flex; align-items: center; gap: 16px;
    height: 56px; position: sticky; top: 0; z-index: 100;
    transition: box-shadow 200ms ease;
  }
  .page-header.scrolled { box-shadow: 0 4px 16px rgba(var(--slate-700-rgb), 0.45); }
  #headerLogo, .project-badge-nav { opacity: 0; animation: headerFadeIn 0.5s ease 0.1s forwards; }
  @keyframes headerFadeIn { to { opacity: 1; } }

  .reveal-on-scroll { opacity: 0; transform: translateY(16px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .reveal-on-scroll.in-view { opacity: 1; transform: translateY(0); }

  input, select, textarea { transition: border-color 150ms ease, box-shadow 150ms ease; }
  .page-header h1 {
    margin: 0; font-size: 15px; font-weight: 600; color: var(--white);
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  }
  .page-nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
  .page-nav a {
    color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 500;
    text-decoration: none; white-space: nowrap;
    padding: 6px 10px; border-radius: var(--radius-sm); transition: all 150ms;
  }
  .page-nav a:hover { color: white; background: rgba(255,255,255,0.15); }
  .logo-img { background: white; padding: 3px 8px; }
  .page-nav a.active {
    color: white; font-weight: 600;
    background: rgba(255,255,255,0.15); border-bottom: 2px solid white; padding-bottom: 4px;
  }
  .project-badge-nav {
    border: none; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700;
    color: white; cursor: pointer; font-family: inherit; white-space: nowrap;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15); transition: opacity 150ms;
  }
  .project-badge-nav:hover { opacity: 0.85; }

  .cal-page-title { font-size: 20px; font-weight: 700; color: var(--gray-900); margin: 0 0 6px; }
  .cal-lead { font-size: 13px; color: var(--gray-500); margin: 0 0 20px; }

  .cal-legend { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--gray-700); font-weight: 600; }
  .cal-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .cal-dot.locle { background: #44B13F; }
  .cal-dot.ozukanzukan { background: #f97316; }
  .cal-dot.worklog { background: #94a3b8; }

  .cal-section { background: var(--white); border: 1px solid var(--gray-100); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow-sm); }

  .cal-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 14px; }
  .cal-nav-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--gray-200);
    background: var(--white); color: var(--gray-700); cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center; transition: all 150ms;
  }
  .cal-nav-btn:hover { border-color: var(--gray-400); color: var(--gray-900); }
  .cal-month-label { font-size: 16px; font-weight: 700; color: var(--gray-900); min-width: 110px; text-align: center; }

  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .cal-weekdays span { text-align: center; font-size: 11px; font-weight: 700; color: var(--gray-400); padding: 4px 0; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell {
    min-height: 78px; border: 1px solid var(--gray-100); border-radius: var(--radius-sm);
    padding: 4px 6px; font-size: 12px; color: var(--gray-700); cursor: pointer;
    display: flex; flex-direction: column; gap: 2px; transition: all 150ms;
  }
  .cal-cell:hover { border-color: var(--gray-400); background: var(--gray-50); }
  .cal-cell.other-month { opacity: 0.35; cursor: default; }
  .cal-cell.other-month:hover { border-color: var(--gray-100); background: none; }
  .cal-cell.today { border-color: #334155; border-width: 2px; }
  .cal-cell.selected { background: var(--gray-50); border-color: #334155; }
  .cal-date-num { font-weight: 600; }
  .cal-marker {
    font-size: 10px; padding: 1px 5px; border-radius: 999px; display: inline-flex;
    align-items: center; gap: 3px; width: fit-content; color: white; font-weight: 700;
  }
  .cal-marker.locle { background: #44B13F; }
  .cal-marker.ozukanzukan { background: #f97316; }
  .cal-marker.worklog { background: #94a3b8; }

  .cal-day-panel { background: var(--white); border: 1px solid var(--gray-100); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); }
  .cal-day-panel-title { font-size: 16px; font-weight: 700; color: var(--gray-900); margin: 0 0 18px; }

  .cal-day-section { margin-bottom: 18px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--gray-100); }
  .cal-day-section:last-child { margin-bottom: 0; }
  .cal-day-section-header { margin: 0; padding: 8px 14px; font-size: 12px; font-weight: 700; color: white; }
  .cal-day-section.locle .cal-day-section-header { background: #44B13F; }
  .cal-day-section.ozukanzukan .cal-day-section-header { background: #f97316; }
  .cal-day-section.worklog .cal-day-section-header { background: #64748b; }
  .cal-day-section-body { padding: 10px 14px; }

  .cal-day-item {
    display: block; font-size: 13px; color: var(--gray-700); text-decoration: none;
    padding: 7px 0; border-bottom: 1px solid var(--gray-100);
  }
  .cal-day-item:last-child { border-bottom: none; }
  .cal-day-item.link { cursor: pointer; }
  .cal-day-item.link:hover { color: var(--gray-900); }
  .cal-day-item-sub { color: var(--gray-400); font-size: 12px; margin-top: 2px; }
  .cal-day-item.done { text-decoration: line-through; color: var(--gray-400); }
  .cal-day-empty { font-size: 12px; color: var(--gray-400); padding: 4px 0; }

  @media (max-width: 700px) {
    .page-header { padding: 0 12px; }
    .page-nav { overflow-x: auto; padding-bottom: 2px; }
    .page-header h1 { font-size: 16px; }
    .btn-theme-toggle { width: 24px; height: 24px; font-size: 12px; }
    .container { padding: 16px 8px; }
    .cal-section, .cal-day-panel { padding: 18px 14px; }
    .toast-container { top: auto; bottom: 16px; right: 8px; left: 8px; max-width: 100%; }
  }

  /* Toast notifications */
  .toast-container {
    position: fixed; top: 72px; right: 16px; z-index: 9999;
    display: flex; flex-direction: column; gap: 8px; max-width: 360px;
  }
  .toast {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow-lg);
    font-size: 13px; line-height: 1.6; animation: slideInRight 0.3s ease;
    pointer-events: auto;
  }
  .toast.success { background: var(--green-50); border: 1px solid var(--green-200); color: var(--green-700); }
  .toast.error   { background: #fff5f5; border: 1px solid #fca5a5; color: #dc2626; }
  .toast.warning { background: #fffbeb; border: 1px solid #fcd34d; color: #b45309; }
  .toast.info    { background: var(--gray-100); border: 1px solid var(--gray-200); color: var(--gray-700); }
  .toast-icon { flex-shrink: 0; font-size: 15px; }
  .toast-body { flex: 1; }
  .toast-close { background: none; border: none; cursor: pointer; opacity: 0.5; font-size: 16px; padding: 0 0 0 8px; }
  .toast-close:hover { opacity: 1; }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .btn-theme-toggle {
    background: rgba(255,255,255,0.15); border: none; color: white;
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    transition: background 150ms; flex-shrink: 0; margin-left: 6px;
  }
  .btn-theme-toggle:hover { background: rgba(255,255,255,0.28); }

  @media (prefers-color-scheme: dark) {
    :root {
      --gray-50:  #0f172a; --gray-100: #1e293b; --gray-200: #334155;
      --gray-300: #475569; --gray-400: #64748b; --gray-500: #94a3b8;
      --gray-700: #cbd5e1; --gray-900: #f1f5f9; --white: #1e293b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.22);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.26);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.4);
    }
    body { background: #0f172a; }
    .page-header { border-bottom-color: #334155; }
    input, select, textarea { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important; }
    .logo-img { background: rgba(255,255,255,0.08) !important; padding: 4px 10px; }
  }
  html.dark {
    --gray-50:  #0f172a; --gray-100: #1e293b; --gray-200: #334155;
    --gray-300: #475569; --gray-400: #64748b; --gray-500: #94a3b8;
    --gray-700: #cbd5e1; --gray-900: #f1f5f9; --white: #1e293b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.22);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.26);
    --shadow-lg: 0 10px 15px rgba(0,0,0,0.4);
  }
  html.dark body { background: #0f172a; }
  html.dark .page-header { border-bottom-color: #334155; }
  html.dark input, html.dark select, html.dark textarea { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important; }
  html.dark .logo-img { background: rgba(255,255,255,0.08) !important; padding: 4px 10px; }
</style>
</head>

<div class="container">

  <p class="cal-page-title">カレンダー</p>
  <p class="cal-lead">LOCLE・群馬お仕事図鑑・出退勤の予定をまとめて確認できます。データはプロジェクトごとに分離されたまま、表示のみ統合しています。</p>

  <div class="cal-legend">
    <span class="cal-legend-item"><span class="cal-dot locle"></span>LOCLE</span>
    <span class="cal-legend-item"><span class="cal-dot ozukanzukan"></span>群馬お仕事図鑑</span>
    <span class="cal-legend-item"><span class="cal-dot worklog"></span>出退勤</span>
  </div>

  <div class="cal-section reveal-on-scroll">
    <div class="cal-header">
      <button type="button" class="cal-nav-btn" onclick="changeMonth(-1)">←</button>
      <span class="cal-month-label" id="calMonthLabel"></span>
      <button type="button" class="cal-nav-btn" onclick="changeMonth(1)">→</button>
    </div>
    <div class="cal-weekdays">
      <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>

  <div class="cal-day-panel reveal-on-scroll" id="calDayPanel" hidden>

    </div>
    <div class="cal-day-section ozukanzukan">
      <p class="cal-day-section-header">群馬お仕事図鑑</p>
      <div class="cal-day-section-body" id="calDayOzukanzukan"></div>
    </div>
    <div class="cal-day-section worklog">
      <p class="cal-day-section-header">出退勤</p>
      <div class="cal-day-section-body" id="calDayWorklog"></div>
    </div>
  </div>

</div>

<script>
  // ===== Toast notifications =====
  function showToast(message, type = "info", duration = 4000) {
    const icons = { success: "✓", error: "✕", warning: "⚠", info: "ℹ" };
    const container = document.getElementById("toastContainer") || (() => {
      const el = document.createElement("div");
      el.id = "toastContainer";
      el.className = "toast-container";
      document.body.appendChild(el);
      return el;
    })();
    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <span class="toast-icon">${icons[type] || "ℹ"}</span>
      <span class="toast-body">${message}</span>
      <button class="toast-close" onclick="this.closest('.toast').remove()">×</button>
    `;
    container.appendChild(toast);
    if (duration > 0) setTimeout(() => toast.remove(), duration);
  }

  // ===== Dark mode toggle =====
  function toggleTheme() {
    document.documentElement.classList.toggle("dark");
    const isDark = document.documentElement.classList.contains("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    updateThemeIcon();
  }
  function updateThemeIcon() {
    const btn = document.getElementById("themeToggleBtn");
    if (!btn) return;
    btn.textContent = document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
  }
  updateThemeIcon();

  function esc(s) {
    return String(s || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function fmtTime(t) {
    return t ? String(t).slice(0, 5) : "--:--";
  }
  function todayStr() {
    return new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Tokyo" });
  }

  // ===== カレンダー本体 =====
  let calYear, calMonth; // month: 1〜12
  let calData = {
    locle: { notes_by_date: {}, todos_by_date: {} },
    ozukanzukan: { notes_by_date: {}, todos_by_date: {} },
    work_logs_by_date: {},
  };
  let selectedCalDate = null;

  function initCalDefaults() {
    const [y, m] = todayStr().split("-").map(Number);
    calYear = y;
    calMonth = m;
  }

  async function loadCalendarData() {
    const grid = document.getElementById("calGrid");
    try {
      const res = await fetch(`/api/crm?action=calendar-events&year=${calYear}&month=${calMonth}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "取得に失敗しました");
      calData = {
        locle: data.locle || { notes_by_date: {}, todos_by_date: {} },
        ozukanzukan: data.ozukanzukan || { notes_by_date: {}, todos_by_date: {} },
        work_logs_by_date: data.work_logs_by_date || {},
      };
    } catch (err) {
      grid.innerHTML = `<p class="cal-day-empty" style="color:#dc2626;">読み込みに失敗しました: ${esc(err.message)}</p>`;
      return;
    }
    renderCalendar();
  }

  function changeMonth(delta) {
    calMonth += delta;
    if (calMonth < 1) { calMonth = 12; calYear -= 1; }
    if (calMonth > 12) { calMonth = 1; calYear += 1; }
    selectedCalDate = null;
    document.getElementById("calDayPanel").hidden = true;
    loadCalendarData();
  }

  function countForDate(projKey, dateKey) {
    const proj = calData[projKey];
    return (proj.notes_by_date[dateKey] || []).length + (proj.todos_by_date[dateKey] || []).length;
  }

  function renderCalendar() {
    document.getElementById("calMonthLabel").textContent = `${calYear}年${calMonth}月`;

    const pad = n => String(n).padStart(2, "0");
    const startWeekday = new Date(calYear, calMonth - 1, 1).getDay(); // 0=日
    const daysInMonth = new Date(calYear, calMonth, 0).getDate();
    const daysInPrevMonth = new Date(calYear, calMonth - 1, 0).getDate();
    const today = todayStr();
    const cells = [];

    for (let i = startWeekday - 1; i >= 0; i--) {
      cells.push({ day: daysInPrevMonth - i, otherMonth: true, dateKey: null });
    }
    for (let d = 1; d <= daysInMonth; d++) {
      cells.push({ day: d, otherMonth: false, dateKey: `${calYear}-${pad(calMonth)}-${pad(d)}` });
    }
    let nextDay = 1;
    while (cells.length % 7 !== 0) {
      cells.push({ day: nextDay++, otherMonth: true, dateKey: null });
    }

    const grid = document.getElementById("calGrid");
    grid.innerHTML = cells.map(c => {
      if (c.otherMonth) {
        return `<div class="cal-cell other-month"><span class="cal-date-num">${c.day}</span></div>`;
      }
      const locleCount = countForDate("locle", c.dateKey);
      const ozuCount = countForDate("ozukanzukan", c.dateKey);
      const workCount = (calData.work_logs_by_date[c.dateKey] || []).length;
      const classes = ["cal-cell"];
      if (c.dateKey === today) classes.push("today");
      if (c.dateKey === selectedCalDate) classes.push("selected");
      const markers = [];
      if (locleCount > 0) markers.push(`<span class="cal-marker locle">🟢${locleCount}</span>`);
      if (ozuCount > 0) markers.push(`<span class="cal-marker ozukanzukan">🟠${ozuCount}</span>`);
      if (workCount > 0) markers.push(`<span class="cal-marker worklog">👤${workCount}</span>`);
      return `<div class="${classes.join(" ")}" onclick="selectCalDate('${c.dateKey}')">
        <span class="cal-date-num">${c.day}</span>
        ${markers.join("")}
      </div>`;
    }).join("");
  }

  function selectCalDate(dateKey) {
    selectedCalDate = dateKey;
    renderCalendar();

    document.getElementById("calDayPanelTitle").textContent = dateKey;
    renderProjectDaySection("locle", "calDayLocle", dateKey);
    renderProjectDaySection("ozukanzukan", "calDayOzukanzukan", dateKey);
    renderWorklogDaySection(dateKey);
    document.getElementById("calDayPanel").hidden = false;
  }

  function renderProjectDaySection(projKey, elId, dateKey) {
    const proj = calData[projKey];
    const notes = proj.notes_by_date[dateKey] || [];
    const todos = proj.todos_by_date[dateKey] || [];
    const el = document.getElementById(elId);

    if (notes.length === 0 && todos.length === 0) {
      el.innerHTML = '<p class="cal-day-empty">この日の予定はありません</p>';
      return;
    }

    let html = "";
    notes.forEach(n => {
      html += `<a class="cal-day-item link" href="/meeting-notes.html?project=${projKey}&note=${n.id}">
        📝 ${esc(n.title)}
        ${n.summary ? `<div class="cal-day-item-sub">${esc(n.summary)}</div>` : ""}
      </a>`;
    });
    todos.forEach(t => {
      html += `<a class="cal-day-item link ${t.done ? "done" : ""}" href="/meeting-notes.html?project=${projKey}&note=${t.note_id}">
        ✓ ${esc(t.text)}
        <div class="cal-day-item-sub">${esc(t.note_title)}</div>
      </a>`;
    });
    el.innerHTML = html;
  }

  function renderWorklogDaySection(dateKey) {
    const logs = calData.work_logs_by_date[dateKey] || [];
    const el = document.getElementById("calDayWorklog");
    if (logs.length === 0) {
      el.innerHTML = '<p class="cal-day-empty">この日の出退勤記録はありません</p>';
      return;
    }
    el.innerHTML = logs.map(l => `
      <a class="cal-day-item link" href="/work-logs.html">
        👤 ${esc(l.user_name)}: ${fmtTime(l.clock_in)} 〜 ${fmtTime(l.clock_out)}
      </a>`).join("");
  }

  initCalDefaults();
  loadCalendarData();
  initScrollReveal();
</script>
</body>
</html>
