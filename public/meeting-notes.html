<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>議事録 - LOCLE営業ツール</title>
<script>
  (function() {
    try {
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved ? saved === "dark" : prefersDark) document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>
<script src="/project-context.js"></script>
<script>applyProjectTheme();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-900: #1a5c17; --green-800: #277025; --green-700: #2F8A2A; --green-600: #3da038;
    --green-500: #44B13F; --green-400: #5BC952; --green-300: #86efac;
    --green-200: #b7e4b0; --green-100: #d8f0d8; --green-50: #f0faf0;
    --green-500-rgb: 68,177,63; --green-700-rgb: 47,138,42; --green-900-rgb: 26,92,23;
    --gray-50: #f8fafc;   --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;  --gray-300: #cbd5e1;
    --gray-400: #94a3b8;  --gray-500: #64748b;
    --gray-700: #334155;  --gray-900: #0f172a;
    --white: #ffffff;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
    --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", "Noto Sans JP", sans-serif; background: var(--gray-50); margin: 0; color: var(--gray-900); line-height: 1.6; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .container { animation: fadeInUp 0.4s ease-out; max-width: 1000px; margin: 0 auto; padding: 24px 16px; }

  .page-header {
    background: linear-gradient(135deg, var(--green-700) 0%, var(--green-500) 100%);
    border-bottom: none; box-shadow: 0 2px 8px rgba(var(--green-700-rgb), 0.3);
    padding: 0 24px; display: flex; align-items: center; gap: 16px;
    height: 56px; position: sticky; top: 0; z-index: 100;
    transition: box-shadow 200ms ease;
  }
  .page-header.scrolled { box-shadow: 0 4px 16px rgba(var(--green-700-rgb), 0.45); }
  #headerLogo, .project-badge-nav { opacity: 0; animation: headerFadeIn 0.5s ease 0.1s forwards; }
  @keyframes headerFadeIn { to { opacity: 1; } }

  .reveal-on-scroll { opacity: 0; transform: translateY(16px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .reveal-on-scroll.in-view { opacity: 1; transform: translateY(0); }

  input, select, textarea { transition: border-color 150ms ease, box-shadow 150ms ease; }
  .page-header h1 {
    margin: 0; font-size: 15px; font-weight: 600; color: var(--white);
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  }
  .page-nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
  .page-nav a {
    color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 500;
    text-decoration: none; white-space: nowrap;
    padding: 6px 10px; border-radius: var(--radius-sm); transition: all 150ms;
  }
  .page-nav a:hover { color: white; background: rgba(255,255,255,0.15); }
  .logo-img { background: white; padding: 3px 8px; }
  .page-nav a.active {
    color: white; font-weight: 600;
    background: rgba(255,255,255,0.15); border-bottom: 2px solid white; padding-bottom: 4px;
  }
  .project-badge-nav {
    border: none; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700;
    color: white; cursor: pointer; font-family: inherit; white-space: nowrap;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15); transition: opacity 150ms;
  }
  .project-badge-nav:hover { opacity: 0.85; }

  .mn-lead { font-size: 13px; color: var(--gray-500); margin: 0 0 20px; }

  .mn-section { background: var(--white); border: 1px solid var(--gray-100); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow-sm); }
  .mn-section-title { font-size: 18px; font-weight: 700; color: var(--gray-900); border-left: 3px solid var(--green-500); padding-left: 12px; margin: 0 0 18px; }

  .mn-form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .mn-form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .mn-form-group.full { grid-column: 1 / -1; }
  .mn-form-group label { font-size: 12px; font-weight: 600; color: var(--gray-500); }
  .mn-form-group input, .mn-form-group select, .mn-form-group textarea {
    padding: 9px 12px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
    background: var(--white); color: var(--gray-900); width: 100%;
  }
  .mn-form-group input:focus, .mn-form-group select:focus, .mn-form-group textarea:focus {
    outline: none; border-color: var(--green-500); box-shadow: 0 0 0 3px var(--green-100);
  }
  .mn-raw-textarea { min-height: 200px; resize: vertical; line-height: 1.7; }

  .mn-form-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

  .btn-primary {
    padding: 10px 22px; background: linear-gradient(135deg, var(--green-500), var(--green-700));
    box-shadow: 0 4px 12px rgba(var(--green-500-rgb), 0.3);
    color: var(--white); border: none; border-radius: var(--radius-sm);
    cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit;
    transition: all 150ms ease;
  }
  .btn-primary:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--green-600), var(--green-800));
    transform: translateY(-1px); box-shadow: 0 6px 16px rgba(var(--green-500-rgb), 0.4);
  }
  .btn-primary:disabled { background: var(--gray-300); box-shadow: none; cursor: not-allowed; transform: none; }

  .btn-secondary {
    padding: 10px 20px; font-size: 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); background: var(--white); color: var(--gray-700);
    cursor: pointer; font-family: inherit; font-weight: 600; transition: all 150ms;
  }
  .btn-secondary:hover:not(:disabled) { background: var(--gray-50); border-color: var(--green-500); color: var(--green-700); }
  .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

  .mn-preview { margin-top: 20px; padding: 18px; background: var(--gray-50); border-radius: var(--radius-md); border-left: 3px solid var(--green-500); }
  .mn-preview-label { font-size: 11px; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; }
  .mn-preview-summary { font-size: 13px; color: var(--gray-700); line-height: 1.8; white-space: pre-wrap; margin-bottom: 12px; }
  .mn-preview-todos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .mn-preview-todos li { font-size: 13px; color: var(--gray-700); padding-left: 18px; position: relative; }
  .mn-preview-todos li::before { content: "☐"; position: absolute; left: 0; color: var(--green-500); }
  .mn-preview-empty { font-size: 13px; color: var(--gray-400); font-style: italic; padding-left: 0 !important; }
  .mn-preview-empty::before { content: none !important; }

  .mn-filters { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 18px; }
  .mn-filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .mn-filter-btn {
    padding: 7px 16px; font-size: 13px; border: 1px solid var(--gray-200);
    background: var(--white); color: var(--gray-700); border-radius: 999px;
    cursor: pointer; font-family: inherit; font-weight: 500; transition: all 150ms;
  }
  .mn-filter-btn.active { background: var(--green-500); border-color: var(--green-500); color: white; font-weight: 600; }

  .mn-list { display: flex; flex-direction: column; gap: 12px; }
  .mn-card {
    background: var(--gray-50); border: 1px solid var(--gray-100); border-radius: var(--radius-md);
    padding: 16px 18px; cursor: pointer; transition: all 150ms;
  }
  .mn-card:hover { border-color: var(--green-500); box-shadow: var(--shadow-sm); }
  .mn-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .mn-card-title { font-size: 14px; font-weight: 700; color: var(--gray-900); flex: 1; min-width: 120px; }
  .mn-type-badge { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .mn-type-badge.type-1on1  { background: var(--green-50); color: var(--green-700); }
  .mn-type-badge.type-zentai { background: #eff6ff; color: #1d4ed8; }
  .mn-type-badge.type-other  { background: var(--gray-100); color: var(--gray-500); }
  .mn-card-date { font-size: 12px; color: var(--gray-400); white-space: nowrap; }
  .mn-card-summary {
    font-size: 13px; color: var(--gray-500); line-height: 1.6; margin-bottom: 6px;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .mn-card-todo-count { font-size: 12px; color: var(--green-700); font-weight: 600; }
  .mn-empty-note { font-size: 13px; color: var(--gray-400); padding: 20px 0; text-align: center; }

  /* 詳細モーダル */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 1000;
    align-items: center; justify-content: center; padding: 16px;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--white); border-radius: var(--radius-lg); max-width: 560px; width: 100%;
    max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--gray-200);
  }
  .modal-header h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--gray-900); }
  .modal-close {
    background: none; border: none; font-size: 18px; cursor: pointer;
    color: var(--gray-400); line-height: 1; padding: 4px 8px; border-radius: var(--radius-sm);
    transition: all 150ms;
  }
  .modal-close:hover { color: var(--gray-700); background: var(--gray-100); }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  .modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--gray-200); }
  .btn-modal-close {
    padding: 7px 16px; font-size: 13px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); background: var(--white); color: var(--gray-700);
    cursor: pointer; font-family: inherit; font-weight: 500; transition: all 150ms;
  }
  .btn-modal-close:hover { background: var(--gray-50); }
  .mn-delete-btn {
    padding: 7px 16px; font-size: 13px; border-radius: var(--radius-sm);
    border: 1px solid #fca5a5; background: white; color: #dc2626;
    cursor: pointer; font-family: inherit; font-weight: 600; margin-right: auto; transition: all 150ms;
  }
  .mn-delete-btn:hover { background: #fff5f5; }

  .mn-detail-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .mn-detail-date { font-size: 12px; color: var(--gray-400); }
  .mn-detail-section-label { font-size: 11px; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 8px; }
  .mn-detail-section-label:first-of-type { margin-top: 0; }
  .mn-detail-summary { font-size: 13px; color: var(--gray-700); line-height: 1.8; white-space: pre-wrap; }
  .mn-detail-todos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .mn-todo-item label { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--gray-700); cursor: pointer; }
  .mn-todo-item input[type="checkbox"] { margin-top: 2px; flex-shrink: 0; width: auto; }
  .mn-todo-done { text-decoration: line-through; color: var(--gray-400); }
  .mn-detail-raw { margin-top: 18px; border-top: 1px solid var(--gray-100); padding-top: 14px; }
  .mn-detail-raw summary { font-size: 12px; font-weight: 600; color: var(--gray-500); cursor: pointer; }
  .mn-detail-raw-text {
    font-size: 12px; color: var(--gray-700); line-height: 1.7; white-space: pre-wrap; margin: 10px 0 0;
    font-family: inherit; background: var(--gray-50); padding: 12px; border-radius: var(--radius-sm);
    max-height: 300px; overflow-y: auto;
  }

  @media (max-width: 700px) {
    .page-header { padding: 0 12px; }
    .page-nav { overflow-x: auto; padding-bottom: 2px; }
    .page-header h1 { font-size: 16px; }
    .btn-theme-toggle { width: 24px; height: 24px; font-size: 12px; }
    .container { padding: 16px 8px; }
    .mn-section { padding: 18px 14px; }
    .toast-container { top: auto; bottom: 16px; right: 8px; left: 8px; max-width: 100%; }
  }

  /* Toast notifications */
  .toast-container {
    position: fixed; top: 72px; right: 16px; z-index: 9999;
    display: flex; flex-direction: column; gap: 8px; max-width: 360px;
  }
  .toast {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow-lg);
    font-size: 13px; line-height: 1.6; animation: slideInRight 0.3s ease;
    pointer-events: auto;
  }
  .toast.success { background: var(--green-50); border: 1px solid var(--green-200); color: var(--green-700); }
  .toast.error   { background: #fff5f5; border: 1px solid #fca5a5; color: #dc2626; }
  .toast.warning { background: #fffbeb; border: 1px solid #fcd34d; color: #b45309; }
  .toast.info    { background: var(--gray-100); border: 1px solid var(--gray-200); color: var(--gray-700); }
  .toast-icon { flex-shrink: 0; font-size: 15px; }
  .toast-body { flex: 1; }
  .toast-title { font-weight: 600; margin-bottom: 2px; }
  .toast-close { background: none; border: none; cursor: pointer; opacity: 0.5; font-size: 16px; padding: 0 0 0 8px; }
  .toast-close:hover { opacity: 1; }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .btn-theme-toggle {
    background: rgba(255,255,255,0.15); border: none; color: white;
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    transition: background 150ms; flex-shrink: 0; margin-left: 6px;
  }
  .btn-theme-toggle:hover { background: rgba(255,255,255,0.28); }

  @media (prefers-color-scheme: dark) {
    :root {
      --gray-50:  #0f172a; --gray-100: #1e293b; --gray-200: #334155;
      --gray-300: #475569; --gray-400: #64748b; --gray-500: #94a3b8;
      --gray-700: #cbd5e1; --gray-900: #f1f5f9; --white: #1e293b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.22);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.26);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.4);
    }
    body { background: #0f172a; }
    .page-header { border-bottom-color: #334155; }
    input, select, textarea { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important; }
    input::placeholder, textarea::placeholder { color: #475569 !important; }
    .logo-img { background: rgba(255,255,255,0.08) !important; padding: 4px 10px; }
    .mn-filter-btn:not(.active) { background: #1e293b; color: #cbd5e1; }
    .modal-box { background: #1e293b; color: #f1f5f9; }
    .mn-detail-raw-text { background: #0f172a; }
  }
  html.dark {
    --gray-50:  #0f172a; --gray-100: #1e293b; --gray-200: #334155;
    --gray-300: #475569; --gray-400: #64748b; --gray-500: #94a3b8;
    --gray-700: #cbd5e1; --gray-900: #f1f5f9; --white: #1e293b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.22);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.26);
    --shadow-lg: 0 10px 15px rgba(0,0,0,0.4);
  }
  html.dark body { background: #0f172a; }
  html.dark .page-header { border-bottom-color: #334155; }
  html.dark input, html.dark select, html.dark textarea { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important; }
  html.dark input::placeholder, html.dark textarea::placeholder { color: #475569 !important; }
  html.dark .logo-img { background: rgba(255,255,255,0.08) !important; padding: 4px 10px; }
  html.dark .mn-filter-btn:not(.active) { background: #1e293b; color: #cbd5e1; }
  html.dark .modal-box { background: #1e293b; color: #f1f5f9; }
  html.dark .mn-detail-raw-text { background: #0f172a; }
</style>
</head>
<body>

<header class="page-header">
  <h1><a href="/app.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
    <img src="/logo.jpg" alt="LOCLE" class="logo-img" id="headerLogo" style="height:28px; width:auto; object-fit:contain; border-radius:6px;">
  </a></h1>
  <button class="project-badge-nav" id="projectBadge" title="クリックしてプロジェクトを切り替え"></button>
  <nav class="page-nav">
    <a href="/home.html" id="navHomeLink">ホーム</a>
    <a href="/companies.html">企業リスト</a>
    <a href="/variants.html">メッセージ管理</a>
    <a href="/send.html">送信管理</a>
    <a href="/analytics.html">分析</a>
    <a href="/crm.html">CRM</a>
    <a href="/meeting-notes.html" class="active">議事録</a>
    <a href="/work-logs.html">稼働管理</a>
    <a href="/content-studio.html" class="content-studio-only" hidden>コンテンツ制作</a>
    <a href="/reports.html">レポート</a>
    <a href="/help.html">ヘルプ</a>
    <a href="/index.html" target="_blank">デモ</a>
    <button class="btn-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="ダークモード切替" title="ダークモード切替">🌙</button>
  </nav>
</header>

<div class="container">

  <p class="mn-section-title" style="border:none; padding:0; font-size:20px;">議事録</p>
  <p class="mn-lead">選択中のプロジェクトの議事録のみ表示されます。LOCLE / 群馬お仕事図鑑でデータは完全に分離されています。</p>

  <div class="mn-section reveal-on-scroll">
    <p class="mn-section-title">議事録を作成</p>
    <div class="mn-form-grid">
      <div class="mn-form-group">
        <label for="mnTitle">タイトル</label>
        <input type="text" id="mnTitle" placeholder="例: 8/6 週次定例">
      </div>
      <div class="mn-form-group">
        <label for="mnType">種別</label>
        <select id="mnType" onchange="invalidatePreview()">
          <option value="1on1">1on1</option>
          <option value="全体定例">全体定例</option>
          <option value="other" selected>その他</option>
        </select>
      </div>
      <div class="mn-form-group">
        <label for="mnDate">開催日</label>
        <input type="date" id="mnDate">
      </div>
    </div>
    <div class="mn-form-group full">
      <label for="mnRawText">議事録本文</label>
      <textarea id="mnRawText" class="mn-raw-textarea" oninput="invalidatePreview()" placeholder="会議中のメモ・発言録などをそのまま貼り付けてください"></textarea>
    </div>
    <div class="mn-form-actions">
      <button type="button" class="btn-secondary" id="mnSummarizeBtn" onclick="summarizePreview()">要約してAIでTodo抽出</button>
      <button type="button" class="btn-primary" id="mnSaveBtn" onclick="saveMeetingNote()" disabled>保存する</button>
    </div>

    <div class="mn-preview" id="mnPreview" hidden>
      <p class="mn-preview-label">プレビュー</p>
      <div class="mn-preview-summary" id="mnPreviewSummary"></div>
      <ul class="mn-preview-todos" id="mnPreviewTodos"></ul>
    </div>
  </div>

  <div class="mn-section reveal-on-scroll">
    <p class="mn-section-title">議事録一覧</p>
    <div class="mn-filters">
      <div class="mn-filter-group">
        <button type="button" class="mn-filter-btn active" data-type="" onclick="setTypeFilter('')">すべて</button>
        <button type="button" class="mn-filter-btn" data-type="1on1" onclick="setTypeFilter('1on1')">1on1</button>
        <button type="button" class="mn-filter-btn" data-type="全体定例" onclick="setTypeFilter('全体定例')">全体定例</button>
        <button type="button" class="mn-filter-btn" data-type="other" onclick="setTypeFilter('other')">その他</button>
      </div>
      <div class="mn-filter-group">
        <button type="button" class="mn-filter-btn active" data-period="all" onclick="setPeriodFilter('all')">全期間</button>
        <button type="button" class="mn-filter-btn" data-period="this" onclick="setPeriodFilter('this')">今月</button>
        <button type="button" class="mn-filter-btn" data-period="last" onclick="setPeriodFilter('last')">先月</button>
      </div>
    </div>
    <div class="mn-list" id="mnList">
      <p class="mn-empty-note">読み込み中...</p>
    </div>
  </div>

</div>

<!-- 詳細モーダル -->
<div class="modal-overlay" id="mnDetailModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="mnDetailTitle">議事録</h3>
      <button class="modal-close" onclick="closeDetailModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="mn-detail-meta">
        <span class="mn-type-badge" id="mnDetailTypeBadge"></span>
        <span class="mn-detail-date" id="mnDetailDate"></span>
      </div>

      <p class="mn-detail-section-label">要約</p>
      <div class="mn-detail-summary" id="mnDetailSummary"></div>

      <p class="mn-detail-section-label">Todo</p>
      <ul class="mn-detail-todos" id="mnDetailTodos"></ul>

      <details class="mn-detail-raw">
        <summary>元の議事録本文</summary>
        <pre class="mn-detail-raw-text" id="mnDetailRawText"></pre>
      </details>
    </div>
    <div class="modal-footer">
      <button class="mn-delete-btn" onclick="deleteCurrentNote()">削除</button>
      <button class="btn-modal-close" onclick="closeDetailModal()">閉じる</button>
    </div>
  </div>
</div>

<script>
  // ===== Toast notifications =====
  function showToast(message, type = "info", duration = 4000) {
    const icons = { success: "✓", error: "✕", warning: "⚠", info: "ℹ" };
    const container = document.getElementById("toastContainer") || (() => {
      const el = document.createElement("div");
      el.id = "toastContainer";
      el.className = "toast-container";
      document.body.appendChild(el);
      return el;
    })();
    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <span class="toast-icon">${icons[type] || "ℹ"}</span>
      <span class="toast-body">${message}</span>
      <button class="toast-close" onclick="this.closest('.toast').remove()">×</button>
    `;
    container.appendChild(toast);
    if (duration > 0) setTimeout(() => toast.remove(), duration);
  }

  // ===== Dark mode toggle =====
  function toggleTheme() {
    document.documentElement.classList.toggle("dark");
    const isDark = document.documentElement.classList.contains("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    updateThemeIcon();
  }
  function updateThemeIcon() {
    const btn = document.getElementById("themeToggleBtn");
    if (!btn) return;
    btn.textContent = document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
  }
  updateThemeIcon();

  function esc(s) {
    return String(s || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function todayStr() {
    return new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Tokyo" });
  }
  function typeLabel(type) {
    if (type === "1on1") return "1on1";
    if (type === "全体定例") return "全体定例";
    return "その他";
  }
  function typeBadgeClass(type) {
    if (type === "1on1") return "type-1on1";
    if (type === "全体定例") return "type-zentai";
    return "type-other";
  }

  // ===== 議事録を作成 =====
  let pendingSummary = null;
  let pendingTodos = [];

  function invalidatePreview() {
    if (document.getElementById("mnPreview").hidden) return;
    document.getElementById("mnPreview").hidden = true;
    document.getElementById("mnSaveBtn").disabled = true;
    pendingSummary = null;
    pendingTodos = [];
  }

  function renderPreview(summary, todos) {
    document.getElementById("mnPreview").hidden = false;
    document.getElementById("mnPreviewSummary").textContent = summary || "(要約なし)";
    const todosEl = document.getElementById("mnPreviewTodos");
    todosEl.innerHTML = todos.length
      ? todos.map(t => `<li>${esc(t)}</li>`).join("")
      : '<li class="mn-preview-empty">Todoは検出されませんでした</li>';
  }

  async function summarizePreview() {
    const rawText = document.getElementById("mnRawText").value.trim();
    if (!rawText) { showToast("議事録本文を入力してください", "error"); return; }
    const meetingType = document.getElementById("mnType").value;

    const btn = document.getElementById("mnSummarizeBtn");
    btn.disabled = true;
    btn.textContent = "要約中...";
    try {
      const res = await fetch("/api/crm?action=summarize-meeting", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ raw_text: rawText, meeting_type: meetingType }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "要約に失敗しました");

      if (data.configured === false) {
        pendingSummary = null;
        pendingTodos = [];
        showToast("AI機能が設定されていません。要約なしで保存できます", "warning");
        renderPreview(null, []);
      } else {
        pendingSummary = data.summary || "";
        pendingTodos = Array.isArray(data.todos) ? data.todos : [];
        renderPreview(pendingSummary, pendingTodos);
        showToast("✓ 要約しました", "success");
      }
      document.getElementById("mnSaveBtn").disabled = false;
    } catch (err) {
      showToast("要約に失敗しました: " + esc(err.message), "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "要約してAIでTodo抽出";
    }
  }

  function resetForm() {
    document.getElementById("mnTitle").value = "";
    document.getElementById("mnRawText").value = "";
    document.getElementById("mnType").value = "other";
    document.getElementById("mnDate").value = todayStr();
    document.getElementById("mnPreview").hidden = true;
    document.getElementById("mnSaveBtn").disabled = true;
    pendingSummary = null;
    pendingTodos = [];
  }

  async function saveMeetingNote() {
    const title = document.getElementById("mnTitle").value.trim();
    if (!title) { showToast("タイトルを入力してください", "error"); return; }
    const rawText = document.getElementById("mnRawText").value.trim();
    if (!rawText) { showToast("議事録本文を入力してください", "error"); return; }
    const meetingType = document.getElementById("mnType").value;
    const meetingDate = document.getElementById("mnDate").value || todayStr();

    const btn = document.getElementById("mnSaveBtn");
    btn.disabled = true;
    try {
      const res = await fetch("/api/crm?action=meeting-notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project: getCurrentProject(),
          title, meeting_type: meetingType, raw_text: rawText, meeting_date: meetingDate,
          summary: pendingSummary, todos: pendingTodos,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "保存に失敗しました");
      showToast("✓ 議事録を保存しました", "success");
      resetForm();
      await loadNotes();
    } catch (err) {
      showToast("保存に失敗しました: " + esc(err.message), "error");
      btn.disabled = false;
    }
  }

  // ===== 議事録一覧 =====
  let allNotes = [];
  let typeFilter = "";
  let periodFilter = "all";

  async function loadNotes() {
    const listEl = document.getElementById("mnList");
    try {
      const res = await fetch("/api/crm?action=meeting-notes&project=" + encodeURIComponent(getCurrentProject()));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "取得に失敗しました");
      allNotes = Array.isArray(data) ? data : [];
    } catch (err) {
      listEl.innerHTML = `<p class="mn-empty-note" style="color:#dc2626;">読み込みに失敗しました: ${esc(err.message)}</p>`;
      return;
    }
    renderList();
  }

  function getMonthRange(which) {
    const today = todayStr();
    const [y, m] = today.split("-").map(Number);
    let year = y, month = m;
    if (which === "last") {
      month -= 1;
      if (month === 0) { month = 12; year -= 1; }
    }
    const pad = n => String(n).padStart(2, "0");
    const from = `${year}-${pad(month)}-01`;
    const lastDay = new Date(year, month, 0).getDate();
    const to = which === "this" ? today : `${year}-${pad(month)}-${pad(lastDay)}`;
    return { from, to };
  }

  function renderList() {
    const listEl = document.getElementById("mnList");
    let filtered = allNotes;
    if (typeFilter) filtered = filtered.filter(n => n.meeting_type === typeFilter);
    if (periodFilter !== "all") {
      const { from, to } = getMonthRange(periodFilter);
      filtered = filtered.filter(n => n.meeting_date >= from && n.meeting_date <= to);
    }

    if (filtered.length === 0) {
      listEl.innerHTML = '<p class="mn-empty-note">議事録がありません</p>';
      return;
    }

    listEl.innerHTML = filtered.map(n => {
      const todos = Array.isArray(n.todos) ? n.todos : [];
      const doneCount = todos.filter(t => t.done).length;
      return `<div class="mn-card" onclick="openDetailModal(${n.id})">
        <div class="mn-card-header">
          <span class="mn-card-title">${esc(n.title)}</span>
          <span class="mn-type-badge ${typeBadgeClass(n.meeting_type)}">${esc(typeLabel(n.meeting_type))}</span>
          <span class="mn-card-date">${esc(n.meeting_date)}</span>
        </div>
        <div class="mn-card-summary">${esc(n.summary || "(要約なし)")}</div>
        <div class="mn-card-todo-count">${todos.length > 0 ? `✓ Todo ${doneCount}/${todos.length}件` : "Todoなし"}</div>
      </div>`;
    }).join("");
  }

  function setTypeFilter(type) {
    typeFilter = type;
    document.querySelectorAll(".mn-filter-btn[data-type]").forEach(b => {
      b.classList.toggle("active", b.dataset.type === type);
    });
    renderList();
  }
  function setPeriodFilter(period) {
    periodFilter = period;
    document.querySelectorAll(".mn-filter-btn[data-period]").forEach(b => {
      b.classList.toggle("active", b.dataset.period === period);
    });
    renderList();
  }

  // ===== 詳細モーダル =====
  let currentDetailNote = null;

  function openDetailModal(id) {
    const note = allNotes.find(n => n.id === id);
    if (!note) return;
    currentDetailNote = note;
    document.getElementById("mnDetailTitle").textContent = note.title;
    const badge = document.getElementById("mnDetailTypeBadge");
    badge.textContent = typeLabel(note.meeting_type);
    badge.className = "mn-type-badge " + typeBadgeClass(note.meeting_type);
    document.getElementById("mnDetailDate").textContent = note.meeting_date;
    document.getElementById("mnDetailSummary").textContent = note.summary || "(要約なし)";
    document.getElementById("mnDetailRawText").textContent = note.raw_text;
    renderDetailTodos();
    document.getElementById("mnDetailModal").classList.add("open");
  }

  function renderDetailTodos() {
    const el = document.getElementById("mnDetailTodos");
    const todos = Array.isArray(currentDetailNote.todos) ? currentDetailNote.todos : [];
    if (todos.length === 0) {
      el.innerHTML = '<li class="mn-preview-empty">Todoはありません</li>';
      return;
    }
    el.innerHTML = todos.map((t, i) => `
      <li class="mn-todo-item">
        <label>
          <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleTodoDone(${i})">
          <span class="${t.done ? "mn-todo-done" : ""}">${esc(t.text)}</span>
        </label>
      </li>`).join("");
  }

  async function toggleTodoDone(index) {
    const todos = (Array.isArray(currentDetailNote.todos) ? currentDetailNote.todos : []).map(t => ({ ...t }));
    if (!todos[index]) return;
    todos[index].done = !todos[index].done;
    try {
      const res = await fetch("/api/crm?action=meeting-notes", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: currentDetailNote.id, todos }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "更新に失敗しました");
      currentDetailNote = data;
      const idx = allNotes.findIndex(n => n.id === data.id);
      if (idx >= 0) allNotes[idx] = data;
      renderDetailTodos();
      renderList();
    } catch (err) {
      showToast("更新に失敗しました: " + esc(err.message), "error");
      renderDetailTodos();
    }
  }

  function closeDetailModal() {
    document.getElementById("mnDetailModal").classList.remove("open");
    currentDetailNote = null;
  }

  async function deleteCurrentNote() {
    if (!currentDetailNote) return;
    if (!confirm(`「${currentDetailNote.title}」を削除しますか？`)) return;
    try {
      const res = await fetch("/api/crm?action=meeting-notes", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: currentDetailNote.id }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "削除に失敗しました");
      showToast("削除しました", "info");
      closeDetailModal();
      await loadNotes();
    } catch (err) {
      showToast("削除に失敗しました: " + esc(err.message), "error");
    }
  }

  document.getElementById("mnDate").value = todayStr();
  loadNotes();
  initScrollReveal();
</script>
</body>
</html>
