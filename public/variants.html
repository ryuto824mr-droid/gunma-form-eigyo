<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>メッセージ管理 - LOCLE営業ツール</title>
<script>
  (function() {
    try {
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved ? saved === "dark" : prefersDark) document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-500: #44B13F; --green-700: #2F8A2A;
    --green-50: #f0faf0;  --green-100: #d8f0d8; --green-200: #b7e4b0;
    --gray-50: #f8fafc;   --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;  --gray-300: #cbd5e1;
    --gray-400: #94a3b8;  --gray-500: #64748b;
    --gray-700: #334155;  --gray-900: #0f172a;
    --white: #ffffff;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
    --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", "Noto Sans JP", sans-serif; background: var(--gray-50); margin: 0; color: var(--gray-900); }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .container { animation: fadeInUp 0.4s ease-out; }

  .page-header {
    background: linear-gradient(135deg, #2F8A2A 0%, #44B13F 50%, #5BC952 100%);
    border-bottom: none; box-shadow: 0 2px 8px rgba(47,138,42,0.3);
    padding: 0 24px; display: flex; align-items: center; gap: 16px;
    height: 56px; position: sticky; top: 0; z-index: 100;
  }
  .page-header h1 {
    margin: 0; font-size: 15px; font-weight: 700; color: var(--white);
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  }
  .page-header h1 svg { width: 18px; height: 18px; }
  .page-nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
  .page-nav a {
    color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 500;
    text-decoration: none; white-space: nowrap;
    padding: 6px 10px; border-radius: var(--radius-sm); transition: all 150ms;
  }
  .page-nav a:hover { color: white; background: rgba(255,255,255,0.15); }
  .logo-img { background: white; padding: 3px 8px; }
  .page-nav a.active {
    color: white; font-weight: 600;
    background: rgba(255,255,255,0.15); border-bottom: 2px solid white; padding-bottom: 4px;
  }

  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

  .create-section, .list-section {
    background: var(--white); border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg); padding: 20px 24px;
    margin-bottom: 20px; box-shadow: var(--shadow-sm);
  }
  .create-section h2, .list-section h2 {
    margin: 0 0 18px; font-size: 14px; font-weight: 600;
    color: var(--gray-700); letter-spacing: -0.01em;
  }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; font-weight: 600; color: var(--gray-500); }
  .form-group input[type="text"],
  .form-group select,
  .form-group textarea {
    padding: 8px 12px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
    background: var(--white); color: var(--gray-900); transition: border-color 150ms;
  }
  .form-group input[type="text"]:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none; border-color: var(--green-500);
    box-shadow: 0 0 0 3px var(--green-100);
  }
  .form-group textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
  .form-hint { font-size: 11px; color: var(--gray-400); margin-top: 4px; }

  .tag-rows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; min-height: 4px; }
  .tag-row { display: flex; align-items: center; gap: 6px; }
  .tag-row input {
    padding: 6px 10px; font-size: 13px; border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm); font-family: inherit; flex: 1;
  }
  .tag-row input:focus { outline: none; border-color: var(--green-500); box-shadow: 0 0 0 3px var(--green-100); }
  .tag-sep { color: var(--gray-400); font-size: 13px; flex-shrink: 0; }
  .btn-tag-remove {
    padding: 4px 8px; font-size: 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); background: var(--white);
    cursor: pointer; color: var(--gray-400); flex-shrink: 0; transition: all 150ms;
  }
  .btn-tag-remove:hover { background: #fff5f5; border-color: #fca5a5; color: #dc2626; }
  .btn-tag-add {
    padding: 5px 12px; font-size: 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--green-500); background: var(--white);
    color: var(--green-700); cursor: pointer; font-family: inherit; font-weight: 600;
    transition: all 150ms;
  }
  .btn-tag-add:hover { background: var(--green-50); }

  .create-footer { margin-top: 18px; display: flex; align-items: center; gap: 14px; }
  .btn-create {
    padding: 8px 20px;
    background: linear-gradient(135deg, #44B13F, #2F8A2A);
    box-shadow: 0 4px 12px rgba(68,177,63,0.3);
    color: var(--white); border: none; border-radius: var(--radius-sm);
    cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600;
    transition: all 150ms; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-create:hover:not(:disabled) {
    background: linear-gradient(135deg, #3da038, #277025);
    transform: translateY(-1px); box-shadow: 0 6px 16px rgba(68,177,63,0.4);
  }
  .btn-create:disabled { background: var(--gray-300); box-shadow: none; cursor: not-allowed; transform: none; }
  .btn-create svg { width: 14px; height: 14px; }
  .form-msg { font-size: 13px; }
  .form-msg.ok    { color: var(--green-700); }
  .form-msg.error { color: #dc2626; }

  /* Variant cards */
  .variant-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .variant-card {
    border: 1px solid var(--gray-200); border-radius: var(--radius-md); padding: 16px;
    background: var(--white); display: flex; flex-direction: column; gap: 10px;
    box-shadow: var(--shadow-sm); transition: transform 200ms ease, box-shadow 200ms ease;
  }
  .variant-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .card-header { display: flex; align-items: flex-start; gap: 8px; }
  .channel-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .card-name { font-weight: 600; font-size: 14px; flex: 1; word-break: break-word; color: var(--gray-900); }
  .channel-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
  }
  .channel-badge.email { background: #dbeafe; color: #1e40af; }
  .channel-badge.form  { background: var(--green-50); color: var(--green-700); }
  .btn-copy-variant {
    padding: 3px 8px; font-size: 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); background: var(--white); color: var(--gray-500);
    cursor: pointer; flex-shrink: 0; transition: all 150ms;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-copy-variant:hover { background: var(--gray-50); color: var(--gray-900); }
  .btn-copy-variant svg { width: 11px; height: 11px; }
  .btn-delete {
    padding: 3px 8px; font-size: 12px; border-radius: var(--radius-sm);
    border: 1px solid #fca5a5; background: var(--white); color: #dc2626;
    cursor: pointer; flex-shrink: 0; transition: all 150ms;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-delete:hover { background: #fff5f5; }
  .btn-delete svg { width: 11px; height: 11px; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag-badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 11px; background: var(--green-50); color: var(--green-700);
    border: 1px solid var(--green-100); font-weight: 500;
  }
  .card-body-preview {
    font-size: 12px; color: var(--gray-500); line-height: 1.7;
    white-space: pre-wrap; word-break: break-word;
    border-top: 1px solid var(--gray-100); padding-top: 10px; margin: 0;
  }
  .list-empty { font-size: 13px; color: var(--gray-400); padding: 20px 0; margin: 0; }
  .list-count { font-size: 12px; color: var(--gray-400); font-weight: 400; margin-left: 8px; }
  .btn-preview {
    padding: 3px 8px; font-size: 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); background: var(--white); color: var(--gray-500);
    cursor: pointer; flex-shrink: 0; transition: all 150ms;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-preview:hover { background: var(--green-50); border-color: var(--green-500); color: var(--green-700); }
  .btn-preview svg { width: 11px; height: 11px; }

  /* Preview modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 1000;
    align-items: center; justify-content: center; padding: 16px;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--white); border-radius: var(--radius-lg); max-width: 560px; width: 100%;
    max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--gray-200);
  }
  .modal-header h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--gray-900); }
  .modal-close {
    background: none; border: none; font-size: 18px; cursor: pointer;
    color: var(--gray-400); line-height: 1; padding: 4px 8px; border-radius: var(--radius-sm);
    transition: all 150ms;
  }
  .modal-close:hover { color: var(--gray-700); background: var(--gray-100); }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .preview-subject {
    font-size: 13px; padding: 10px 14px; background: var(--gray-50);
    border-left: 3px solid var(--green-500); border-radius: var(--radius-sm); color: var(--gray-900);
  }
  .preview-body-text {
    white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.8;
    padding: 14px 16px; background: var(--gray-50);
    border-left: 3px solid var(--green-500); border-radius: var(--radius-sm);
    color: var(--gray-700); margin: 0;
  }
  .btn-modal-close {
    padding: 7px 16px; font-size: 13px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); background: var(--white); color: var(--gray-700);
    cursor: pointer; font-family: inherit; font-weight: 500; transition: all 150ms;
  }
  .btn-modal-close:hover { background: var(--gray-50); }

  /* Spotlight Tour */
  .tour-overlay {
    position: fixed;
    inset: 0;
    z-index: 9998;
    background: transparent;
  }
  .tour-highlight {
    position: relative;
    z-index: 9999 !important;
    box-shadow: 0 0 0 4px var(--green-500), 0 0 0 9999px rgba(0,0,0,0.5) !important;
    border-radius: 8px;
    transition: box-shadow 0.3s ease;
  }
  .tour-bubble {
    position: fixed;
    z-index: 10000;
    background: white;
    border-radius: 12px;
    padding: 20px 24px;
    min-width: 280px;
    max-width: 340px;
    width: calc(100vw - 32px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    animation: tourFadeInUp 0.3s ease;
  }
  @keyframes tourFadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .tour-bubble::before {
    content: "";
    position: absolute;
    width: 0; height: 0;
    border: 8px solid transparent;
  }
  .tour-bubble.pos-bottom::before { top: -16px; left: 24px; border-bottom-color: white; }
  .tour-bubble.pos-top::before    { bottom: -16px; left: 24px; border-top-color: white; }
  .tour-bubble.pos-center::before { display: none; }
  .tour-bubble-dots { display: flex; gap: 6px; margin: 0 0 12px; }
  .tour-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gray-200); transition: all 0.2s ease; }
  .tour-dot.active { background: var(--green-500); width: 16px; border-radius: 3px; }
  .tour-bubble-title { font-size: 15px; font-weight: 700; color: var(--green-700); margin: 0 0 8px; }
  .tour-bubble-desc  { font-size: 13px; color: var(--gray-500); line-height: 1.7; margin: 0 0 16px; }
  .tour-bubble-nav   { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tour-bubble-counter { font-size: 11px; color: var(--gray-400); font-weight: 600; }
  .btn-tskip {
    padding: 6px 12px; font-size: 12px; border: 1px solid var(--gray-200);
    background: white; color: var(--gray-500); border-radius: var(--radius-sm);
    cursor: pointer; font-family: inherit;
  }
  .btn-tnext {
    padding: 10px 24px; font-size: 14px; font-weight: 600;
    background: linear-gradient(135deg, #44B13F, #2F8A2A);
    color: white; border: none; border-radius: var(--radius-sm);
    cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 8px rgba(68,177,63,0.3);
  }
  .btn-help-float {
    position: fixed; bottom: 24px; right: 24px; z-index: 500;
    padding: 10px 18px; font-size: 13px; font-weight: 600;
    background: white; color: var(--green-700);
    border: 2px solid var(--green-500); border-radius: 999px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    transition: all 150ms; display: flex; align-items: center; gap: 6px;
  }
  .btn-help-float:hover { background: var(--green-50); transform: translateY(-2px); }

  @media (max-width: 600px) {
    .page-header { padding: 0 12px; }
    .page-nav { overflow-x: auto; padding-bottom: 2px; }
    .page-header h1 { font-size: 16px; }
    .btn-theme-toggle { width: 24px; height: 24px; font-size: 12px; }
    .toast-container { top: auto; bottom: 16px; right: 8px; left: 8px; max-width: 100%; }
    .container { padding: 16px 8px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .form-group input[type="text"],
    .form-group select,
    .form-group textarea { font-size: 16px; }
    .tag-row input { font-size: 16px; }
    .btn-create { min-height: 44px; width: 100%; justify-content: center; }
    .variant-card { padding: 12px; }
    .card-body-preview { max-height: 3.2em; overflow: hidden; }
  }

  /* Toast notifications */
  .toast-container {
    position: fixed; top: 72px; right: 16px; z-index: 9999;
    display: flex; flex-direction: column; gap: 8px; max-width: 360px;
  }
  .toast {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow-lg);
    font-size: 13px; line-height: 1.5; animation: slideInRight 0.3s ease;
    pointer-events: auto;
  }
  .toast.success { background: #f0faf0; border: 1px solid var(--green-200); color: var(--green-700); }
  .toast.error   { background: #fff5f5; border: 1px solid #fca5a5; color: #dc2626; }
  .toast.warning { background: #fffbeb; border: 1px solid #fcd34d; color: #b45309; }
  .toast.info    { background: #eff6ff; border: 1px solid #93c5fd; color: #1d4ed8; }
  .toast-icon { flex-shrink: 0; font-size: 15px; }
  .toast-body { flex: 1; }
  .toast-title { font-weight: 600; margin-bottom: 2px; }
  .toast-close { background: none; border: none; cursor: pointer; opacity: 0.5; font-size: 16px; padding: 0 0 0 8px; }
  .toast-close:hover { opacity: 1; }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* Dark mode toggle */
  .btn-theme-toggle {
    background: rgba(255,255,255,0.15); border: none; color: white;
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    transition: background 150ms; flex-shrink: 0; margin-left: 6px;
  }
  .btn-theme-toggle:hover { background: rgba(255,255,255,0.28); }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    :root {
      --gray-50:  #0f172a;
      --gray-100: #1e293b;
      --gray-200: #334155;
      --gray-300: #475569;
      --gray-400: #64748b;
      --gray-500: #94a3b8;
      --gray-700: #cbd5e1;
      --gray-900: #f1f5f9;
      --white:    #1e293b;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.3);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.4);
    }
    body { background: #0f172a; }
    .page-header { border-bottom-color: #334155; }
    input, textarea, select {
      background: #1e293b !important;
      color: #f1f5f9 !important;
      border-color: #334155 !important;
    }
    input::placeholder, textarea::placeholder { color: #475569 !important; }
    table thead { background: #1e293b; }
    .modal-box, .tour-bubble { background: #1e293b; color: #f1f5f9; }
    .preview-subject, .preview-body-text { background: #0f172a; }
    .logo-img { background: rgba(255,255,255,0.08) !important; padding: 4px 10px; }
    .btn-primary, button[class*="btn-add"], button[class*="btn-bulk"],
    button[class*="btn-research"], #addBtn, #bulkBtn {
      background: linear-gradient(135deg, #44B13F, #2F8A2A) !important;
      color: white !important;
      opacity: 1 !important;
    }
  }
  html.dark {
    --gray-50:  #0f172a;
    --gray-100: #1e293b;
    --gray-200: #334155;
    --gray-300: #475569;
    --gray-400: #64748b;
    --gray-500: #94a3b8;
    --gray-700: #cbd5e1;
    --gray-900: #f1f5f9;
    --white:    #1e293b;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 6px rgba(0,0,0,0.3);
    --shadow-lg: 0 10px 15px rgba(0,0,0,0.4);
  }
  html.dark body { background: #0f172a; }
  html.dark .page-header { border-bottom-color: #334155; }
  html.dark input, html.dark textarea, html.dark select {
    background: #1e293b !important;
    color: #f1f5f9 !important;
    border-color: #334155 !important;
  }
  html.dark input::placeholder, html.dark textarea::placeholder { color: #475569 !important; }
  html.dark table thead { background: #1e293b; }
  html.dark .modal-box, html.dark .tour-bubble { background: #1e293b; color: #f1f5f9; }
  html.dark .preview-subject, html.dark .preview-body-text { background: #0f172a; }
  html.dark .logo-img { background: rgba(255,255,255,0.08) !important; padding: 4px 10px; }
  html.dark .btn-primary,
  html.dark button[class*="btn-"] { opacity: 1; }
</style>
</head>
<body>

<header class="page-header">
  <h1><a href="/index.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
    <img src="/logo.jpg" alt="LOCLE" class="logo-img" style="height:28px; width:auto; object-fit:contain; border-radius:6px;">
  </a></h1>
  <nav class="page-nav">
    <a href="/index.html">ホーム</a>
    <a href="/companies.html">企業リスト</a>
    <a href="/variants.html" class="active">メッセージ管理</a>
    <a href="/send.html">送信管理</a>
    <a href="/analytics.html">分析</a>
    <a href="/crm.html">CRM</a>
    <a href="/help.html">ヘルプ</a>
    <button class="btn-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="ダークモード切替" title="ダークモード切替">🌙</button>
  </nav>
</header>

<div class="container">

  <section class="create-section">
    <h2>バリアントを作成</h2>
    <div class="form-grid">

      <div class="form-group">
        <label for="inputName">名前 <span style="color:#dc2626">*</span></label>
        <input type="text" id="inputName" placeholder="例: 初回挨拶メール v1" />
      </div>

      <div class="form-group">
        <label for="inputChannel">チャネル <span style="color:#dc2626">*</span></label>
        <select id="inputChannel">
          <option value="email">📧 メール</option>
          <option value="form">📝 フォーム</option>
        </select>
      </div>

      <div class="form-group full">
        <label for="inputSubject">件名テンプレート（メールの場合・任意）</label>
        <input type="text" id="inputSubject" placeholder="例: {{company_name}} 様へのご提案" />
      </div>

      <div class="form-group full">
        <label for="inputBody">本文テンプレート <span style="color:#dc2626">*</span></label>
        <textarea id="inputBody" placeholder="例: {{company_name}} ご担当者様&#10;&#10;はじめてご連絡させていただきます..."></textarea>
        <p class="form-hint">{{company_name}} のように書くと、送信時に企業名が自動で差し込まれます</p>
      </div>

      <div class="form-group full">
        <label>タグ（key: value 形式で任意追加）</label>
        <div class="tag-rows" id="tagRows"></div>
        <button type="button" class="btn-tag-add" onclick="addTagRow()">＋ タグを追加</button>
      </div>

    </div>
    <div class="create-footer">
      <button class="btn-create" id="createBtn" onclick="createVariant()">
        <i data-lucide="plus"></i>作成
      </button>
      <span class="form-msg" id="formMsg"></span>
    </div>
  </section>

  <section class="list-section">
    <h2>バリアント一覧<span class="list-count" id="listCount"></span></h2>
    <div id="variantList"><p class="list-empty">読み込み中...</p></div>
  </section>

</div>

<!-- プレビューモーダル -->
<div class="modal-overlay" id="previewModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>送信前プレビュー</h3>
      <button class="modal-close" onclick="closePreview()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="previewCompanyName">企業名</label>
        <input type="text" id="previewCompanyName" oninput="renderPreview()" />
      </div>
      <div class="form-group" id="previewSubjectGroup">
        <label>件名プレビュー</label>
        <div class="preview-subject" id="previewSubjectText"></div>
      </div>
      <div class="form-group">
        <label>本文プレビュー</label>
        <pre class="preview-body-text" id="previewBodyText"></pre>
      </div>
      <div style="display:flex; justify-content:flex-end;">
        <button class="btn-modal-close" onclick="closePreview()">閉じる</button>
      </div>
    </div>
  </div>
</div>

<button class="btn-help-float" id="helpFloatBtn">？ 使い方</button>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  let variants = [];

  async function loadVariants() {
    try {
      const res = await fetch("/api/variants");
      if (!res.ok) throw new Error("取得失敗");
      variants = await res.json();
      renderVariants();
    } catch (err) {
      document.getElementById("variantList").innerHTML =
        `<p class="list-empty">読み込みエラー: ${esc(err.message)}</p>`;
    }
  }

  function renderVariants() {
    const el      = document.getElementById("variantList");
    const countEl = document.getElementById("listCount");
    countEl.textContent = `（${variants.length}件）`;

    if (variants.length === 0) {
      el.innerHTML = '<p class="list-empty">バリアントがまだ登録されていません</p>';
      return;
    }
    el.innerHTML = `<div class="variant-cards">${variants.map(v => renderCard(v)).join("")}</div>`;
    lucide.createIcons();
  }

  function renderCard(v) {
    const channelIcon  = v.channel === "email" ? "📧" : "📝";
    const channelLabel = v.channel === "email" ? "メール" : "フォーム";
    const tags    = (v.tags && typeof v.tags === "object") ? v.tags : {};
    const tagKeys = Object.keys(tags);
    const tagsHtml = tagKeys.length > 0
      ? `<div class="card-tags">${tagKeys.map(k =>
          `<span class="tag-badge">${esc(k)}: ${esc(tags[k])}</span>`).join("")}</div>`
      : "";
    const bodyText = v.body_template || "";
    const preview  = bodyText.slice(0, 100) + (bodyText.length > 100 ? "…" : "");

    return `
      <div class="variant-card" id="card-${v.id}">
        <div class="card-header">
          <span class="channel-icon">${channelIcon}</span>
          <span class="card-name">${esc(v.name)}</span>
          <span class="channel-badge ${esc(v.channel)}">${channelLabel}</span>
          <button class="btn-preview" onclick="openPreview(${v.id})">
            <i data-lucide="eye"></i>プレビュー
          </button>
          <button class="btn-copy-variant" onclick="copyVariant(${v.id})">
            <i data-lucide="copy"></i>コピー
          </button>
          <button class="btn-delete" onclick="deleteVariant(${v.id})">
            <i data-lucide="trash-2"></i>削除
          </button>
        </div>
        ${tagsHtml}
        <p class="card-body-preview">${esc(preview)}</p>
      </div>`;
  }

  async function createVariant() {
    const name             = document.getElementById("inputName").value.trim();
    const channel          = document.getElementById("inputChannel").value;
    const subject_template = document.getElementById("inputSubject").value.trim();
    const body_template    = document.getElementById("inputBody").value.trim();
    const btn              = document.getElementById("createBtn");

    if (!name)          { showMsg("名前を入力してください", "error"); return; }
    if (!body_template) { showMsg("本文テンプレートを入力してください", "error"); return; }

    const tags = getTags();
    btn.disabled = true;
    showMsg("作成中...", "");

    try {
      const res = await fetch("/api/variants", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, channel, subject_template: subject_template || null, body_template, tags }),
      });
      const data = await res.json();
      if (!res.ok) { showMsg(data.error || "作成エラー", "error"); showToast(esc(data.error || "作成エラー"), "error"); return; }

      variants.unshift(data);
      renderVariants();
      document.getElementById("inputName").value    = "";
      document.getElementById("inputChannel").value = "email";
      document.getElementById("inputSubject").value = "";
      document.getElementById("inputBody").value    = "";
      document.getElementById("tagRows").innerHTML  = "";
      showMsg("作成しました", "ok");
      showToast("バリアントを作成しました", "success");
    } catch (err) {
      showMsg(err.message, "error");
      showToast(esc(err.message), "error");
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="plus"></i>作成';
      lucide.createIcons();
    }
  }

  let previewVariant = null;

  function openPreview(id) {
    const variant = variants.find(v => v.id === id);
    if (!variant) return;
    previewVariant = variant;
    document.getElementById("previewCompanyName").value = "株式会社サンプル";
    document.getElementById("previewSubjectGroup").hidden = variant.channel !== "email" && !variant.subject_template;
    renderPreview();
    document.getElementById("previewModal").classList.add("open");
  }

  function closePreview() {
    document.getElementById("previewModal").classList.remove("open");
    previewVariant = null;
  }

  function renderPreview() {
    if (!previewVariant) return;
    const name = document.getElementById("previewCompanyName").value.trim() || "株式会社サンプル";
    const replace = s => (s || "").replace(/\{\{company_name\}\}/g, name);
    document.getElementById("previewSubjectText").textContent = replace(previewVariant.subject_template) || "(件名なし)";
    document.getElementById("previewBodyText").textContent = replace(previewVariant.body_template);
  }

  async function copyVariant(id) {
    try {
      const res  = await fetch("/api/variants", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ copy_from_id: id }),
      });
      const data = await res.json();
      if (!res.ok) { showToast(esc(data.error || "コピーエラー"), "error"); return; }
      variants.unshift(data);
      renderVariants();
      showToast("バリアントをコピーしました", "success");
    } catch (err) {
      showToast(esc(err.message), "error");
    }
  }

  async function deleteVariant(id) {
    if (!confirm("このバリアントを削除しますか？")) return;
    try {
      const res  = await fetch(`/api/variants/${id}`, { method: "DELETE" });
      const data = await res.json();
      if (!res.ok) { showToast(esc(data.error || "削除エラー"), "error"); return; }
      variants = variants.filter(v => v.id !== id);
      renderVariants();
      showToast("バリアントを削除しました", "info");
    } catch (err) {
      showToast(esc(err.message), "error");
    }
  }

  function addTagRow() {
    const container = document.getElementById("tagRows");
    const row = document.createElement("div");
    row.className = "tag-row";
    row.innerHTML = `
      <input type="text" class="tag-key" placeholder="キー（例: industry）" />
      <span class="tag-sep">:</span>
      <input type="text" class="tag-val" placeholder="値（例: IT）" />
      <button type="button" class="btn-tag-remove" onclick="this.parentElement.remove()">✕</button>`;
    container.appendChild(row);
    row.querySelector(".tag-key").focus();
  }

  function getTags() {
    const rows = document.querySelectorAll("#tagRows .tag-row");
    const tags = {};
    rows.forEach(row => {
      const key = row.querySelector(".tag-key").value.trim();
      const val = row.querySelector(".tag-val").value.trim();
      if (key) tags[key] = val;
    });
    return tags;
  }

  function showMsg(text, type) {
    const el = document.getElementById("formMsg");
    el.textContent = text;
    el.className = "form-msg" + (type ? " " + type : "");
  }

  function esc(s) {
    return String(s || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ===== Toast notifications =====
  function showToast(message, type = "info", duration = 4000) {
    const icons = { success: "✓", error: "✕", warning: "⚠", info: "ℹ" };
    const container = document.getElementById("toastContainer") || (() => {
      const el = document.createElement("div");
      el.id = "toastContainer";
      el.className = "toast-container";
      document.body.appendChild(el);
      return el;
    })();
    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <span class="toast-icon">${icons[type] || "ℹ"}</span>
      <span class="toast-body">${message}</span>
      <button class="toast-close" onclick="this.closest('.toast').remove()">×</button>
    `;
    container.appendChild(toast);
    if (duration > 0) setTimeout(() => toast.remove(), duration);
  }

  // ===== Dark mode toggle =====
  function toggleTheme() {
    document.documentElement.classList.toggle("dark");
    const isDark = document.documentElement.classList.contains("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    updateThemeIcon();
  }

  function updateThemeIcon() {
    const btn = document.getElementById("themeToggleBtn");
    if (!btn) return;
    btn.textContent = document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
  }

  updateThemeIcon();

  // ===== Spotlight Tour =====
  (function() {
    var _steps, _key, _idx, _bubble, _overlay;

    function _resolveEl(sel) {
      var parts = sel.split(",");
      for (var i = 0; i < parts.length; i++) {
        var el = document.querySelector(parts[i].trim());
        if (el) return el;
      }
      return null;
    }

    function _clearHighlight() {
      document.querySelectorAll(".tour-highlight").forEach(function(el) {
        el.classList.remove("tour-highlight");
      });
      if (_bubble && _bubble.parentNode) _bubble.parentNode.removeChild(_bubble);
      _bubble = null;
      if (_overlay && _overlay.parentNode) _overlay.parentNode.removeChild(_overlay);
      _overlay = null;
    }

    function _showStep(idx) {
      _clearHighlight();
      var s = _steps[idx];
      var total = _steps.length;
      var isLast = idx === total - 1;
      var target = _resolveEl(s.targetSelector);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });

      // オーバーレイはクリックをブロックするだけで、クリックしてもツアーは終了しない
      _overlay = document.createElement("div");
      _overlay.className = "tour-overlay";
      document.body.appendChild(_overlay);

      setTimeout(function() {
        if (target) target.classList.add("tour-highlight");

        var dots = "";
        for (var d = 0; d < total; d++) {
          dots += '<span class="tour-dot' + (d === idx ? ' active' : '') + '"></span>';
        }

        _bubble = document.createElement("div");
        _bubble.className = "tour-bubble pos-" + (s.position || "bottom");
        _bubble.innerHTML =
          '<div class="tour-bubble-dots">' + dots + '</div>' +
          '<p class="tour-bubble-title">' + s.title + '</p>' +
          '<p class="tour-bubble-desc">' + s.description + '</p>' +
          '<div class="tour-bubble-nav">' +
            '<button class="btn-tskip" id="_tskip">スキップ</button>' +
            '<span class="tour-bubble-counter">' + (idx + 1) + ' / ' + total + '</span>' +
            '<button class="btn-tnext" id="_tnext">' + (isLast ? 'はじめる ✓' : '次へ →') + '</button>' +
          '</div>';
        document.body.appendChild(_bubble);

        _bubble.querySelector("#_tskip").addEventListener("click", function() { _end(); });
        _bubble.querySelector("#_tnext").addEventListener("click", function() {
          if (idx < total - 1) _showStep(idx + 1); else _end();
        });

        if (s.position === "center" || !target) {
          _bubble.className = "tour-bubble pos-center";
          _bubble.style.top = "50%"; _bubble.style.left = "50%";
          _bubble.style.transform = "translate(-50%, -50%)";
        } else {
          var rect = target.getBoundingClientRect();
          var bw = _bubble.offsetWidth || 320;
          var bh = _bubble.offsetHeight || 160;
          var margin = 12;
          var pos = s.position || "bottom";

          if (pos === "bottom" && (rect.bottom + margin + bh > window.innerHeight - 20)) {
            pos = "top";
          }
          _bubble.className = "tour-bubble pos-" + pos;

          var left = Math.max(8, Math.min(rect.left, window.innerWidth - bw - 8));

          if (pos === "bottom") {
            _bubble.style.top = (rect.bottom + margin) + "px";
            _bubble.style.left = left + "px";
          } else if (pos === "top") {
            _bubble.style.left = left + "px";
            _bubble.style.top = Math.max(8, rect.top - bh - margin) + "px";
          } else if (pos === "right") {
            _bubble.style.top = rect.top + "px";
            _bubble.style.left = (rect.right + margin) + "px";
          } else if (pos === "left") {
            _bubble.style.top = rect.top + "px";
            _bubble.style.left = (rect.left - bw - margin) + "px";
          }
        }
      }, 500);
    }

    function _end() { _clearHighlight(); localStorage.setItem(_key, "1"); }

    function startTour(steps, storageKey) {
      _steps = steps; _key = storageKey; _idx = 0;
      if (!localStorage.getItem(_key)) _showStep(0);
    }

    document.getElementById("helpFloatBtn").addEventListener("click", function() {
      localStorage.removeItem(_key); _idx = 0; _showStep(0);
    });

    window.startTour = startTour;
  })();
  // ===== End Spotlight Tour =====

  lucide.createIcons();
  loadVariants();
  startTour([
    { targetSelector: ".create-section", title: "バリアントを作成する", description: "名前・チャネル・件名・本文を入力して作成します。本文に{{company_name}}と書くと送信時に企業名が自動で入ります。", position: "bottom" },
    { targetSelector: "#tagRows",        title: "タグで分類する",       description: "「トーン:カジュアル」「長さ:短文」など自由にタグを付けられます。分析ページでタグ別の反応率を比較できます。",        position: "top" },
    { targetSelector: ".list-section",   title: "バリアント一覧",       description: "作成したバリアントがここに表示されます。複数のバリアントを用意して、反応率の良い文面を見つけましょう。",            position: "top" }
  ], "locle_tour_variants");
</script>
</body>
</html>
