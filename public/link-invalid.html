<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>リンクを開けませんでした</title>
<!-- メールのクリック計測(api/crm.js の track-click)で、リンク先が正しくないときの戻り先。
     メールの受信者が見るページなので守りの外(lib/auth-gate.js)に置き、ツールの中身は何も出さない -->
<style>
  :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --border: #334155; }
  }
  body {
    font-family: "Inter","Noto Sans JP",sans-serif; background: var(--bg); color: var(--text);
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card {
    max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 32px 24px; text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: var(--muted); margin: 0; line-height: 1.7; }
</style>
</head>
<body>
  <main class="card">
    <h1>リンクを開けませんでした</h1>
    <p>お手数ですが、メールに記載の連絡先までお問い合わせください。</p>
  </main>
</body>
</html>
