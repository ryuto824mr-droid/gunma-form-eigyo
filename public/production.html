<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>制作進行管理 - LOCLE営業ツール</title>
<script>
  (function() {
    try {
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved ? saved === "dark" : prefersDark) document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>
<script src="/project-context.js"></script>
<script>applyProjectTheme();</script>
<script src="/nav-menu.js"></script>
<link rel="stylesheet" href="/nav-menu.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-900: #1a5c17; --green-800: #277025; --green-700: #2F8A2A; --green-600: #3da038;
    --green-500: #44B13F; --green-400: #5BC952; --green-300: #86efac;
    --green-200: #b7e4b0; --green-100: #d8f0d8; --green-50: #f0faf0;
    --green-500-rgb: 68,177,63; --green-700-rgb: 47,138,42; --green-900-rgb: 26,92,23;
    --gray-50: #f8fafc;   --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;  --gray-300: #cbd5e1;
    --gray-400: #94a3b8;  --gray-500: #64748b;
    --gray-700: #334155;  --gray-900: #0f172a;
    --white: #ffffff;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
    --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", "Noto Sans JP", sans-serif; background: var(--gray-50); margin: 0; color: var(--gray-900); line-height: 1.6; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .container { animation: fadeInUp 0.4s ease-out; }

  .page-header {
    background: linear-gradient(135deg, var(--green-700) 0%, var(--green-500) 100%);
    border-bottom: none; box-shadow: 0 2px 8px rgba(var(--green-700-rgb), 0.3);
    padding: 0 24px; display: flex; align-items: center; gap: 16px;
    height: 56px; position: sticky; top: 0; z-index: 100;
    transition: box-shadow 200ms ease;
  }
  .page-header.scrolled { box-shadow: 0 4px 16px rgba(var(--green-700-rgb), 0.45); }
  #headerLogo, .project-badge-nav { opacity: 0; animation: headerFadeIn 0.5s ease 0.1s forwards; }
  @keyframes headerFadeIn { to { opacity: 1; } }

  .reveal-on-scroll { opacity: 0; transform: translateY(16px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .reveal-on-scroll.in-view { opacity: 1; transform: translateY(0); }

  input, select, textarea { transition: border-color 150ms ease, box-shadow 150ms ease; }
  .page-header h1 {
    margin: 0; font-size: 15px; font-weight: 600; color: var(--white);
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  }
  .page-header h1 svg { width: 18px; height: 18px; }
  .page-nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
  .page-nav a {
    color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 500;
    text-decoration: none; white-space: nowrap;
    padding: 6px 10px; border-radius: var(--radius-sm); transition: all 150ms;
  }
  .page-nav a:hover { color: white; background: rgba(255,255,255,0.15); }
  .logo-img { background: white; padding: 3px 8px; }
  .page-nav a.active {
    color: white; font-weight: 600;
    background: rgba(255,255,255,0.15); border-bottom: 2px solid white; padding-bottom: 4px;
  }
  .project-badge-nav {
    border: none; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700;
    color: white; cursor: pointer; font-family: inherit; white-space: nowrap;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15); transition: opacity 150ms;
  }
  .project-badge-nav:hover { opacity: 0.85; }

  .container { max-width: 1120px; margin: 0 auto; padding: 24px 16px; }

  .section-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--gray-900); }
  .prod-lead { font-size: 13px; color: var(--gray-500); margin: 4px 0 20px; }

  /* プロジェクトガード(LOCLE選択時の案内。ナビ非表示はURL直打ちでバイパス可能なため、
     ページ側でも現在のプロジェクトを確認しフォームへ到達させない) */
  .prod-guard {
    background: var(--white); border: 1px solid var(--gray-100); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); padding: 56px 24px; text-align: center;
  }
  .prod-guard-icon { font-size: 32px; margin-bottom: 12px; }
  .prod-guard-text { font-size: 13px; color: var(--gray-500); margin: 0 0 18px; }

  .panel-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
  .btn-add {
    padding: 8px 16px;
    background: linear-gradient(135deg, var(--green-500), var(--green-700));
    box-shadow: 0 4px 12px rgba(var(--green-500-rgb), 0.3);
    color: var(--white); border: none; border-radius: var(--radius-sm);
    cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600;
    transition: all 150ms; display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .btn-add:hover {
    background: linear-gradient(135deg, var(--green-600), var(--green-800));
    transform: translateY(-1px); box-shadow: 0 6px 16px rgba(var(--green-500-rgb), 0.4);
  }
  .btn-add svg { width: 14px; height: 14px; }

  /* Kanban */
  .kanban-board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; }
  .kanban-column {
    flex: 0 0 240px; background: var(--gray-50); border: 1px solid var(--gray-200);
    border-top: 4px solid var(--gray-300);
    border-radius: var(--radius-md); padding: 10px; min-height: 200px;
    display: flex; flex-direction: column; gap: 8px; transition: background 150ms, border-color 150ms;
  }
  .kanban-column.drag-over { background: var(--green-50); border-color: var(--green-500); }
  /* ステージが進むほど列の上端の色をグレー→グリーンへ段階的に濃くし、進行度を視覚的に区切る */
  .stage-appointment { border-top-color: var(--gray-300); }
  .stage-interview   { border-top-color: var(--gray-400); }
  .stage-shooting     { border-top-color: var(--green-300); }
  .stage-editing       { border-top-color: var(--green-400); }
  .stage-review         { border-top-color: var(--green-500); }
  .stage-posted         { border-top-color: var(--green-700); }
  .kanban-column-header {
    font-size: 12px; font-weight: 700; color: var(--gray-700);
    display: flex; flex-direction: column; gap: 2px; align-items: flex-start; padding: 2px 4px 8px;
  }
  .kanban-column-header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
  /* 件数バッジ: 丸みのあるピル形状+ステージカラーで、列を見ただけで件数が把握できるようにする */
  .kanban-count {
    font-size: 12px; font-weight: 700; color: var(--gray-500); background: var(--gray-100);
    padding: 2px 9px; border-radius: 999px; min-width: 20px; text-align: center;
  }
  .stage-appointment .kanban-count { background: var(--gray-200); color: var(--gray-700); }
  .stage-interview   .kanban-count { background: var(--gray-200); color: var(--gray-700); }
  .stage-shooting     .kanban-count { background: var(--green-100); color: var(--green-700); }
  .stage-editing       .kanban-count { background: var(--green-100); color: var(--green-700); }
  .stage-review         .kanban-count { background: var(--green-200); color: var(--green-700); }
  .stage-posted         .kanban-count { background: var(--green-500); color: white; }
  .kanban-cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
  .kanban-card {
    background: var(--white); border: 1px solid var(--gray-100); border-radius: var(--radius-sm);
    padding: 14px 16px; cursor: grab; box-shadow: var(--shadow-sm); transition: box-shadow 150ms, opacity 150ms, transform 150ms;
  }
  .kanban-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .kanban-card.dragging { opacity: 0.45; box-shadow: var(--shadow-lg); cursor: grabbing; }
  .kanban-card.pending-change { cursor: not-allowed; opacity: 0.6; }
  .kanban-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
  .kanban-card-company { font-size: 14px; font-weight: 700; color: var(--gray-900); margin-bottom: 3px; }
  .kanban-card-delete {
    background: none; border: none; color: var(--gray-300); cursor: pointer;
    font-size: 13px; padding: 0 2px; line-height: 1; flex-shrink: 0; transition: color 150ms;
  }
  .kanban-card-delete:hover { color: #dc2626; }
  .kanban-card-title { font-size: 13px; font-weight: 500; margin: 0 0 10px; color: var(--gray-700); word-break: break-word; }
  .kanban-card-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
  .kanban-card-assignee { font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .kanban-card-assignee-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .kanban-card-date {
    font-size: 11px; color: var(--gray-500); font-weight: 600; display: inline-flex; align-items: center;
    gap: 3px; background: var(--gray-100); padding: 2px 8px; border-radius: 999px;
  }
  .kanban-card-date.due-warning { color: #dc2626; font-weight: 700; background: #fee2e2; }
  .kanban-empty { font-size: 12px; color: var(--gray-300); text-align: center; padding: 24px 8px; }
  .kanban-column-header-top span:first-child {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 600;
  }
  .stage-appointment .kanban-column-header-top span:first-child { background: var(--gray-100); color: var(--gray-700); }
  .stage-interview   .kanban-column-header-top span:first-child { background: var(--gray-200); color: var(--gray-700); }
  .stage-shooting     .kanban-column-header-top span:first-child { background: var(--green-50); color: var(--green-700); }
  .stage-editing       .kanban-column-header-top span:first-child { background: var(--green-100); color: var(--green-700); }
  .stage-review         .kanban-column-header-top span:first-child { background: var(--green-200); color: var(--green-700); }
  .stage-posted         .kanban-column-header-top span:first-child { background: var(--green-500); color: white; }

  /* Forms / modals (shared) */
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 12px; font-weight: 600; color: var(--gray-500); }
  .form-group input[type="text"],
  .form-group input[type="date"],
  .form-group select,
  .form-group textarea {
    padding: 8px 12px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
    background: var(--white); color: var(--gray-900); transition: border-color 150ms ease, box-shadow 150ms ease; width: 100%;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: var(--green-500); box-shadow: 0 0 0 3px var(--green-100);
  }
  .form-group textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
  .modal-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .modal-form-grid .full { grid-column: 1 / -1; }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 1000;
    align-items: center; justify-content: center; padding: 16px;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--white); border-radius: var(--radius-lg); max-width: 520px; width: 100%;
    max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--gray-200);
  }
  .modal-header h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--gray-900); }
  .modal-close {
    background: none; border: none; font-size: 18px; cursor: pointer;
    color: var(--gray-400); line-height: 1; padding: 4px 8px; border-radius: var(--radius-sm);
    transition: all 150ms;
  }
  .modal-close:hover { color: var(--gray-700); background: var(--gray-100); }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--gray-200); }
  .btn-modal-cancel {
    padding: 7px 16px; font-size: 13px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); background: var(--white); color: var(--gray-700);
    cursor: pointer; font-family: inherit; font-weight: 500; transition: all 150ms;
  }
  .btn-modal-cancel:hover { background: var(--gray-50); transform: translateY(-1px); }
  .btn-modal-submit {
    padding: 7px 18px; font-size: 13px; border-radius: var(--radius-sm);
    border: none; background: linear-gradient(135deg, var(--green-500), var(--green-700)); color: white;
    cursor: pointer; font-family: inherit; font-weight: 600; transition: all 150ms;
  }
  .btn-modal-submit:hover:not(:disabled) { transform: translateY(-1px); }
  .btn-modal-submit:disabled { background: var(--gray-300); cursor: not-allowed; }
  .btn-modal-delete {
    padding: 7px 16px; font-size: 13px; border-radius: var(--radius-sm);
    border: 1px solid #fca5a5; background: var(--white); color: #dc2626;
    cursor: pointer; font-family: inherit; font-weight: 600; transition: all 150ms; margin-right: auto;
  }
  .btn-modal-delete:hover { background: #fff5f5; }

  /* 担当者選択モーダル(work-logsの「編集者を選択」モーダルと同じパターン) */
  .prod-editor-select-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .prod-editor-select-btn {
    padding: 10px 20px; font-size: 14px; font-weight: 600; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); background: var(--white); color: var(--gray-900);
    cursor: pointer; font-family: inherit; transition: all 150ms;
  }
  .prod-editor-select-btn:hover { border-color: var(--green-500); background: var(--green-50); color: var(--green-700); transform: translateY(-1px); }
  .prod-editor-select-hint { margin: 0; font-size: 12px; color: var(--gray-500); }

  /* 詳細モーダル */
  .prod-detail-meta { font-size: 12px; color: var(--gray-500); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .prod-detail-section-title { font-size: 13px; font-weight: 700; color: var(--gray-700); margin: 4px 0 0; }

  /* Timeline (進行履歴。crm.htmlの活動履歴タイムラインと同じ縦線+丸マーカーの構成に統一) */
  .timeline { position: relative; display: flex; flex-direction: column; }
  .timeline-item { position: relative; padding: 0 0 18px 34px; }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-item::before {
    content: ""; position: absolute; left: 10px; top: 22px; bottom: -2px; width: 2px; background: var(--gray-200);
  }
  .timeline-item:last-child::before { display: none; }
  .timeline-marker {
    position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
    background: var(--gray-100); border: 2px solid var(--gray-400); z-index: 1;
  }
  /* マーカーの色は「進んだ先のステージ」に合わせる(カンバンの列の色分けと対応させる) */
  .timeline-marker.stage-appointment { border-color: var(--gray-400); background: var(--gray-100); }
  .timeline-marker.stage-interview   { border-color: var(--gray-400); background: var(--gray-100); }
  .timeline-marker.stage-shooting     { border-color: var(--green-400); background: var(--green-50); }
  .timeline-marker.stage-editing       { border-color: var(--green-500); background: var(--green-50); }
  .timeline-marker.stage-review         { border-color: var(--green-600); background: var(--green-100); }
  .timeline-marker.stage-posted         { border-color: var(--green-700); background: var(--green-100); }
  .timeline-content-box {
    background: var(--gray-50); border: 1px solid var(--gray-100); border-radius: var(--radius-md);
    padding: 10px 14px;
  }
  .timeline-header { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .timeline-stage-change { font-weight: 600; font-size: 13px; color: var(--gray-900); }
  .timeline-date { font-size: 11px; color: var(--gray-400); margin-left: auto; white-space: nowrap; }
  .timeline-by { font-size: 12px; color: var(--gray-500); margin: 3px 0 0; }
  .list-empty { font-size: 13px; color: var(--gray-400); padding: 16px 0; margin: 0; text-align: center; }

  @media (max-width: 600px) {
    .page-header { padding: 0 12px; }
    .page-nav { overflow-x: auto; padding-bottom: 2px; }
    .page-header h1 { font-size: 16px; }
    .btn-theme-toggle { width: 24px; height: 24px; font-size: 12px; }
    .toast-container { top: auto; bottom: 16px; right: 8px; left: 8px; max-width: 100%; }
    .container { padding: 16px 8px; }
    .modal-form-grid { grid-template-columns: 1fr; }
    .modal-form-grid .full { grid-column: 1; }
    .form-group input, .form-group select, .form-group textarea { font-size: 16px; }
    .kanban-column { flex-basis: 220px; }
  }

  /* Toast notifications */
  .toast-container {
    position: fixed; top: 72px; right: 16px; z-index: 9999;
    display: flex; flex-direction: column; gap: 8px; max-width: 360px;
  }
  .toast {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow-lg);
    font-size: 13px; line-height: 1.6; animation: slideInRight 0.3s ease;
    pointer-events: auto;
  }
  .toast.success { background: var(--green-50); border: 1px solid var(--green-200); color: var(--green-700); }
  .toast.error   { background: #fff5f5; border: 1px solid #fca5a5; color: #dc2626; }
  .toast.warning { background: #fffbeb; border: 1px solid #fcd34d; color: #b45309; }
  .toast.info    { background: var(--gray-100); border: 1px solid var(--gray-200); color: var(--gray-700); }
  .toast-icon { flex-shrink: 0; font-size: 15px; }
  .toast-body { flex: 1; }
  .toast-close { background: none; border: none; cursor: pointer; opacity: 0.5; font-size: 16px; padding: 0 0 0 8px; }
  .toast-close:hover { opacity: 1; }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .btn-theme-toggle {
    background: rgba(255,255,255,0.15); border: none; color: white;
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    transition: background 150ms; flex-shrink: 0; margin-left: 6px;
  }
  .btn-theme-toggle:hover { background: rgba(255,255,255,0.28); }

  @media (prefers-color-scheme: dark) {
    :root {
      --gray-50:  #0f172a; --gray-100: #1e293b; --gray-200: #334155;
      --gray-300: #475569; --gray-400: #64748b; --gray-500: #94a3b8;
      --gray-700: #cbd5e1; --gray-900: #f1f5f9; --white: #1e293b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.22);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.26);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.4);
    }
    body { background: #0f172a; }
    .page-header { border-bottom-color: #334155; }
    input, textarea, select { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important; }
    input::placeholder, textarea::placeholder { color: #475569 !important; }
    .modal-box { background: #1e293b; color: #f1f5f9; }
    .logo-img { background: rgba(255,255,255,0.08) !important; padding: 4px 10px; }
    .kanban-column { background: #0f172a; }
    .timeline-content-box { background: #0f172a; }
  }
  html.dark {
    --gray-50:  #0f172a; --gray-100: #1e293b; --gray-200: #334155;
    --gray-300: #475569; --gray-400: #64748b; --gray-500: #94a3b8;
    --gray-700: #cbd5e1; --gray-900: #f1f5f9; --white: #1e293b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.22);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.26);
    --shadow-lg: 0 10px 15px rgba(0,0,0,0.4);
  }
  html.dark body { background: #0f172a; }
  html.dark .page-header { border-bottom-color: #334155; }
  html.dark input, html.dark textarea, html.dark select {
    background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important;
  }
  html.dark input::placeholder, html.dark textarea::placeholder { color: #475569 !important; }
  html.dark .modal-box { background: #1e293b; color: #f1f5f9; }
  html.dark .logo-img { background: rgba(255,255,255,0.08) !important; padding: 4px 10px; }
  html.dark .kanban-column { background: #0f172a; }
  html.dark .timeline-content-box { background: #0f172a; }
</style>
</head>
<body>

<header class="page-header">
  <h1><a href="/app.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
    <img src="/logo.jpg" alt="LOCLE" class="logo-img" id="headerLogo" style="height:28px; width:auto; object-fit:contain; border-radius:6px;">
  </a></h1>
  <button class="project-badge-nav" id="projectBadge" title="クリックしてプロジェクトを切り替え"></button>
  <nav class="page-nav">
    <button class="btn-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="ダークモード切替" title="ダークモード切替">🌙</button>
  </nav>
</header>

<div class="container">

  <p class="section-title">制作進行管理</p>
  <p class="prod-lead">アポ獲得から投稿まで、取材・撮影コンテンツの制作進行をカンバン形式で管理します</p>

  <div id="prodProjectGuard" class="prod-guard" hidden>
    <div class="prod-guard-icon">🔒</div>
    <p class="prod-guard-text">この機能は「群馬お仕事図鑑」プロジェクト選択時のみご利用いただけます。</p>
    <button type="button" class="btn-add" style="width:auto;" onclick="switchToOzukanzukan()">群馬お仕事図鑑に切り替える</button>
  </div>

  <div id="prodMainContent">
    <div class="panel-toolbar reveal-on-scroll">
      <div></div>
      <button class="btn-add" onclick="openTaskAddModal()"><i data-lucide="plus"></i>タスクを追加</button>
    </div>
    <div class="kanban-board reveal-on-scroll" id="prodKanbanBoard"></div>
  </div>

</div>

<!-- タスク追加モーダル -->
<div class="modal-overlay" id="taskAddModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>タスクを追加</h3>
      <button class="modal-close" onclick="closeTaskAddModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="modal-form-grid">
        <div class="form-group full">
          <label for="taskAddCompanySelect">企業</label>
          <select id="taskAddCompanySelect"><option value="">なし</option></select>
        </div>
        <div class="form-group full">
          <label for="taskAddTitleInput">タイトル <span style="color:#dc2626">*</span></label>
          <input type="text" id="taskAddTitleInput" placeholder="例: 〇〇商店様 取材＆撮影" />
        </div>
        <div class="form-group">
          <label for="taskAddAssigneeInput">担当者</label>
          <input type="text" id="taskAddAssigneeInput" placeholder="例: りゅうと" list="prodStaffList" />
          <datalist id="prodStaffList">
            <option value="りゅうと"></option>
            <option value="宮田"></option>
            <option value="岡田"></option>
          </datalist>
        </div>
        <div class="form-group">
          <label for="taskAddDueDateInput">期限日</label>
          <input type="date" id="taskAddDueDateInput" />
        </div>
        <div class="form-group full">
          <label for="taskAddContentInput">内容</label>
          <textarea id="taskAddContentInput" placeholder="取材内容・撮影の希望日時・注意事項など"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-modal-cancel" onclick="closeTaskAddModal()">キャンセル</button>
      <button class="btn-modal-submit" id="taskAddSubmitBtn" onclick="createProductionTask()">追加</button>
    </div>
  </div>
</div>

<!-- 担当者選択モーダル: ドラッグ&ドロップでステージを変更する直前に必ず挟む -->
<div class="modal-overlay" id="prodEditorSelectModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>担当者を選択</h3>
      <button class="modal-close" onclick="cancelProdEditorSelect()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <p class="prod-editor-select-hint">誰がこのタスクを次の工程に進めましたか？</p>
      <div class="prod-editor-select-buttons">
        <button type="button" class="prod-editor-select-btn" onclick="confirmProdEditorSelect('りゅうと')">りゅうと</button>
        <button type="button" class="prod-editor-select-btn" onclick="confirmProdEditorSelect('宮田')">宮田</button>
        <button type="button" class="prod-editor-select-btn" onclick="confirmProdEditorSelect('岡田')">岡田</button>
      </div>
      <div class="form-group">
        <label for="prodEditorSelectOther">その他</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="prodEditorSelectOther" placeholder="氏名を入力"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();confirmProdEditorSelectOther();}">
          <button type="button" class="btn-add" onclick="confirmProdEditorSelectOther()">決定</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- タスク詳細モーダル -->
<div class="modal-overlay" id="taskDetailModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="taskDetailTitle">タスク詳細</h3>
      <button class="modal-close" onclick="closeTaskDetailModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="prod-detail-meta" id="taskDetailMeta"></div>

      <div class="modal-form-grid">
        <div class="form-group full">
          <label for="taskDetailTitleInput">タイトル <span style="color:#dc2626">*</span></label>
          <input type="text" id="taskDetailTitleInput" />
        </div>
        <div class="form-group">
          <label for="taskDetailAssigneeInput">担当者</label>
          <input type="text" id="taskDetailAssigneeInput" list="prodStaffList" />
        </div>
        <div class="form-group">
          <label for="taskDetailDueDateInput">期限日</label>
          <input type="date" id="taskDetailDueDateInput" />
        </div>
        <div class="form-group full">
          <label for="taskDetailContentInput">内容</label>
          <textarea id="taskDetailContentInput"></textarea>
        </div>
      </div>

      <p class="prod-detail-section-title">進行履歴</p>
      <div class="timeline" id="taskDetailHistory"><p class="list-empty">読み込み中...</p></div>
    </div>
    <div class="modal-footer">
      <button class="btn-modal-delete" onclick="deleteProductionTaskFromDetail()">削除</button>
      <button class="btn-modal-cancel" onclick="closeTaskDetailModal()">キャンセル</button>
      <button class="btn-modal-submit" id="taskDetailSaveBtn" onclick="saveTaskDetail()">保存</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  const PRODUCTION_STAGE_ORDER  = ["appointment", "interview", "shooting", "editing", "review", "posted"];
  const PRODUCTION_STAGE_LABELS = {
    appointment: "アポ獲得", interview: "取材", shooting: "撮影",
    editing: "編集", review: "確認", posted: "投稿",
  };

  let productionTasks = [];
  let prodCompanies = [];

  function esc(s) {
    return String(s || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ===== Toast notifications =====
  function showToast(message, type = "info", duration = 4000) {
    const icons = { success: "✓", error: "✕", warning: "⚠", info: "ℹ" };
    const container = document.getElementById("toastContainer") || (() => {
      const el = document.createElement("div");
      el.id = "toastContainer";
      el.className = "toast-container";
      document.body.appendChild(el);
      return el;
    })();
    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <span class="toast-icon">${icons[type] || "ℹ"}</span>
      <span class="toast-body">${message}</span>
      <button class="toast-close" onclick="this.closest('.toast').remove()">×</button>
    `;
    container.appendChild(toast);
    if (duration > 0) setTimeout(() => toast.remove(), duration);
  }

  // ===== Dark mode toggle =====
  function toggleTheme() {
    document.documentElement.classList.toggle("dark");
    const isDark = document.documentElement.classList.contains("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    updateThemeIcon();
  }
  function updateThemeIcon() {
    const btn = document.getElementById("themeToggleBtn");
    if (!btn) return;
    btn.textContent = document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
  }
  updateThemeIcon();

  // ===== プロジェクトガード =====
  // この機能は群馬お仕事図鑑専用。ナビリンクの非表示はバイパス可能(URL直打ち)なため、
  // ページ側でも現在のプロジェクトを確認し、LOCLE選択時はカンバンへ到達させず案内のみ表示する。
  // (データ側のガードはapi/crm.jsのhandleProductionTasksでは行っていないが、テーブル自体が
  // project列を持ちPOST時にozukanzukan固定で登録されるため、LOCLE側から作成されることはない)
  function switchToOzukanzukan() {
    setCurrentProject("ozukanzukan");
    window.location.href = addProjectParamToUrl("/production.html", "ozukanzukan");
  }

  function initProduction() {
    if (getCurrentProject() !== "ozukanzukan") {
      document.getElementById("prodMainContent").hidden = true;
      document.getElementById("prodProjectGuard").hidden = false;
      return;
    }
    loadCompanies();
    loadProductionTasks();
  }

  // ===== 企業選択 =====
  async function loadCompanies() {
    const sel = document.getElementById("taskAddCompanySelect");
    try {
      const res = await fetch("/api/companies?project=ozukanzukan");
      const raw = await res.json();
      prodCompanies = Array.isArray(raw) ? raw : [];
    } catch (e) {
      prodCompanies = [];
    }
    const options = prodCompanies.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
    sel.innerHTML = '<option value="">なし</option>' + options;
  }

  function companyName(companyId) {
    const c = prodCompanies.find(x => x.id === companyId);
    return c ? c.name : "";
  }

  // ===== タスク一覧・カンバン =====
  async function loadProductionTasks() {
    try {
      const res = await fetch("/api/crm?action=production-tasks&project=ozukanzukan");
      const raw = await res.json();
      if (!res.ok) throw new Error((raw && raw.error) || "取得失敗");
      productionTasks = Array.isArray(raw) ? raw : [];
      renderKanban();
    } catch (err) {
      document.getElementById("prodKanbanBoard").innerHTML =
        `<p class="list-empty">読み込みエラー: ${esc(err.message)}</p>`;
    }
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  // 期限が3日以内(当日含む)または過ぎている場合に警告扱いにする
  function isDueWarning(dueDate) {
    if (!dueDate) return false;
    const due = String(dueDate).slice(0, 10);
    const today = todayStr();
    const diffDays = (new Date(due) - new Date(today)) / (1000 * 60 * 60 * 24);
    return diffDays <= 3;
  }

  function renderKanban() {
    const board = document.getElementById("prodKanbanBoard");
    board.innerHTML = PRODUCTION_STAGE_ORDER.map(stage => {
      const stageTasks = productionTasks.filter(t => t.stage === stage);
      const cardsHtml = stageTasks.length
        ? stageTasks.map(t => renderTaskCard(t)).join("")
        : '<p class="kanban-empty">まだタスクがありません</p>';
      return `
        <div class="kanban-column stage-${stage}" data-stage="${stage}"
             ondragover="onColumnDragOver(event)" ondragleave="onColumnDragLeave(event)" ondrop="onColumnDrop(event)">
          <div class="kanban-column-header">
            <div class="kanban-column-header-top">
              <span>${PRODUCTION_STAGE_LABELS[stage]}</span>
              <span class="kanban-count">${stageTasks.length}件</span>
            </div>
          </div>
          <div class="kanban-cards">${cardsHtml}</div>
        </div>`;
    }).join("");
    lucide.createIcons();
  }

  function renderTaskCard(t) {
    const dueWarning = isDueWarning(t.due_date);
    const dueText = t.due_date
      ? new Date(t.due_date).toLocaleDateString("ja-JP", { month: "2-digit", day: "2-digit" })
      : "";
    // ステージ変更のPATCHが送信中(サーバー応答待ち)のカードはドラッグ不可にする。
    // 応答が返る前に同じカードを再度ドラッグ→確定できてしまうと、サーバー側のstage/履歴が
    // 競合して不整合を起こすため(先勝ち/後勝ちが更新順序に依存してしまう)
    const isPending = pendingStageChangeTaskIds.has(t.id);
    return `
      <div class="kanban-card${isPending ? " pending-change" : ""}" draggable="${isPending ? "false" : "true"}" data-task-id="${t.id}"
           ondragstart="onCardDragStart(event)" ondragend="onCardDragEnd(event)"
           onclick="openTaskDetailModal(${t.id})">
        <div class="kanban-card-header">
          <div class="kanban-card-company">${esc(t.company_name || "")}</div>
          <button class="kanban-card-delete" onclick="event.stopPropagation(); deleteProductionTask(${t.id})" title="削除">✕</button>
        </div>
        <p class="kanban-card-title">${esc(t.title)}</p>
        <div class="kanban-card-meta">
          ${t.assignee
            ? `<span class="kanban-card-assignee" style="color:${getMemberColor(t.assignee)};">
                 <span class="kanban-card-assignee-dot" style="background:${getMemberColor(t.assignee)};"></span>${esc(t.assignee)}
               </span>`
            : "<span></span>"}
          ${dueText
            ? `<span class="kanban-card-date ${dueWarning ? "due-warning" : ""}">${(dueWarning ? "⚠️ " : "") + dueText}</span>`
            : "<span></span>"}
        </div>
      </div>`;
  }

  async function deleteProductionTask(id) {
    if (!confirm("このタスクを削除しますか？")) return;
    try {
      const res = await fetch("/api/crm?action=production-tasks", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id }),
      });
      const data = await res.json();
      if (!res.ok) { showToast(esc(data.error || "削除エラー"), "error"); return; }
      productionTasks = productionTasks.filter(t => t.id !== id);
      renderKanban();
      showToast("タスクを削除しました", "info");
    } catch (err) {
      showToast("削除エラー: " + esc(err.message), "error");
    }
  }

  // ===== ドラッグ&ドロップ =====
  let draggedTaskId = null;

  // モーダル(タスク追加・担当者選択・タスク詳細のいずれか)が表示中は、それが画面全体を覆って
  // カードへのクリックを遮っているために「たまたま」他のカードをドラッグできないのではなく、
  // dragstart自体を明示的に無効化しておく。CSSやz-indexが将来変わっても安全性が保たれるようにするため。
  function isAnyModalOpen() {
    return document.querySelector(".modal-overlay.open") !== null;
  }

  // ステージ変更のPATCHをサーバーに送信中(応答待ち)のタスクIDを保持する。担当者選択モーダルは
  // 「確定」を押した時点で即座に閉じるため、応答が返るまでの間にそのカードを再度ドラッグ&確定
  // できてしまうと、サーバー側のUPDATE/履歴INSERTが競合し不整合を起こす。それを防ぐため、
  // 送信中は該当カードのみ明示的にドラッグ不可にする(成功・失敗いずれの場合も応答が返り次第解除)
  let pendingStageChangeTaskIds = new Set();

  function onCardDragStart(e) {
    if (isAnyModalOpen()) {
      e.preventDefault();
      return;
    }
    const taskId = parseInt(e.target.closest(".kanban-card").dataset.taskId, 10);
    if (pendingStageChangeTaskIds.has(taskId)) {
      e.preventDefault();
      return;
    }
    draggedTaskId = taskId;
    e.target.closest(".kanban-card").classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  }
  function onCardDragEnd(e) {
    e.target.closest(".kanban-card")?.classList.remove("dragging");
  }
  function onColumnDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add("drag-over");
  }
  function onColumnDragLeave(e) {
    e.currentTarget.classList.remove("drag-over");
  }
  function onColumnDrop(e) {
    e.preventDefault();
    const column = e.currentTarget;
    column.classList.remove("drag-over");
    const newStage = column.dataset.stage;
    if (draggedTaskId == null) return;
    const task = productionTasks.find(t => t.id === draggedTaskId);
    const taskId = draggedTaskId;
    draggedTaskId = null;
    if (!task || task.stage === newStage) return;
    // ステージ変更は担当者選択モーダルで確認してから確定する
    openProdEditorSelectModal({ taskId, newStage });
  }

  // ===== 担当者選択モーダル(ステージ変更の確定用) =====
  let pendingStageChange = null;

  function openProdEditorSelectModal(action) {
    pendingStageChange = action;
    document.getElementById("prodEditorSelectOther").value = "";
    document.getElementById("prodEditorSelectModal").classList.add("open");
  }
  function cancelProdEditorSelect() {
    pendingStageChange = null;
    document.getElementById("prodEditorSelectModal").classList.remove("open");
    renderKanban(); // ドラッグ中の見た目を元に戻す(ステージ変更自体はキャンセル)
  }
  function confirmProdEditorSelect(name) {
    if (!pendingStageChange) return;
    document.getElementById("prodEditorSelectModal").classList.remove("open");
    const { taskId, newStage } = pendingStageChange;
    pendingStageChange = null;
    applyStageChange(taskId, newStage, name);
  }
  function confirmProdEditorSelectOther() {
    const name = document.getElementById("prodEditorSelectOther").value.trim();
    if (!name) { showToast("氏名を入力してください", "error"); return; }
    confirmProdEditorSelect(name);
  }

  async function applyStageChange(taskId, newStage, changedBy) {
    const task = productionTasks.find(t => t.id === taskId);
    if (!task) return;
    const prevStage = task.stage;
    task.stage = newStage;
    pendingStageChangeTaskIds.add(taskId);
    renderKanban();
    try {
      const res = await fetch("/api/crm?action=production-tasks", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: taskId, stage: newStage, changed_by: changedBy }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "更新エラー");
      Object.assign(task, data);
      showToast(`「${PRODUCTION_STAGE_LABELS[newStage]}」に進めました`, "success");
    } catch (err) {
      task.stage = prevStage;
      showToast("ステージ変更に失敗しました: " + esc(err.message), "error");
    } finally {
      // 成功・失敗どちらの場合もサーバー応答を受け取った時点でドラッグ不可状態を解除する
      pendingStageChangeTaskIds.delete(taskId);
      renderKanban();
    }
  }

  // ===== タスク追加モーダル =====
  function openTaskAddModal() {
    document.getElementById("taskAddCompanySelect").value = "";
    document.getElementById("taskAddTitleInput").value = "";
    document.getElementById("taskAddAssigneeInput").value = "";
    document.getElementById("taskAddDueDateInput").value = "";
    document.getElementById("taskAddContentInput").value = "";
    document.getElementById("taskAddModal").classList.add("open");
  }
  function closeTaskAddModal() {
    document.getElementById("taskAddModal").classList.remove("open");
  }

  async function createProductionTask() {
    const company_id = document.getElementById("taskAddCompanySelect").value || null;
    const title       = document.getElementById("taskAddTitleInput").value.trim();
    const assignee    = document.getElementById("taskAddAssigneeInput").value.trim();
    const due_date    = document.getElementById("taskAddDueDateInput").value || null;
    const content     = document.getElementById("taskAddContentInput").value.trim();
    const btn = document.getElementById("taskAddSubmitBtn");

    if (!title) { showToast("タイトルを入力してください", "error"); return; }

    btn.disabled = true;
    try {
      const res = await fetch("/api/crm?action=production-tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ project: "ozukanzukan", company_id, title, assignee: assignee || null, due_date, content: content || null }),
      });
      const data = await res.json();
      if (!res.ok) { showToast(esc(data.error || "作成エラー"), "error"); return; }
      productionTasks.push(data);
      renderKanban();
      closeTaskAddModal();
      showToast("タスクを追加しました", "success");
    } catch (err) {
      showToast("作成エラー: " + esc(err.message), "error");
    } finally {
      btn.disabled = false;
    }
  }

  // ===== タスク詳細モーダル =====
  let detailTaskId = null;

  function openTaskDetailModal(id) {
    const task = productionTasks.find(t => t.id === id);
    if (!task) return;
    detailTaskId = id;
    document.getElementById("taskDetailTitle").textContent = PRODUCTION_STAGE_LABELS[task.stage] + " ・ タスク詳細";
    document.getElementById("taskDetailTitleInput").value    = task.title || "";
    document.getElementById("taskDetailAssigneeInput").value = task.assignee || "";
    document.getElementById("taskDetailDueDateInput").value  = task.due_date ? String(task.due_date).slice(0, 10) : "";
    document.getElementById("taskDetailContentInput").value  = task.content || "";
    document.getElementById("taskDetailMeta").innerHTML =
      `<span>企業: ${esc(task.company_name || "なし")}</span><span>ステージ: ${PRODUCTION_STAGE_LABELS[task.stage]}</span>`;
    document.getElementById("taskDetailHistory").innerHTML = '<p class="list-empty">読み込み中...</p>';
    document.getElementById("taskDetailModal").classList.add("open");
    loadTaskHistory(id);
  }

  function closeTaskDetailModal() {
    document.getElementById("taskDetailModal").classList.remove("open");
    detailTaskId = null;
  }

  async function saveTaskDetail() {
    if (!detailTaskId) return;
    const title    = document.getElementById("taskDetailTitleInput").value.trim();
    const assignee = document.getElementById("taskDetailAssigneeInput").value.trim();
    const due_date = document.getElementById("taskDetailDueDateInput").value || null;
    const content  = document.getElementById("taskDetailContentInput").value.trim();
    const btn = document.getElementById("taskDetailSaveBtn");

    if (!title) { showToast("タイトルを入力してください", "error"); return; }

    btn.disabled = true;
    try {
      const res = await fetch("/api/crm?action=production-tasks", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: detailTaskId, title, assignee: assignee || null, due_date, content: content || null }),
      });
      const data = await res.json();
      if (!res.ok) { showToast(esc(data.error || "更新エラー"), "error"); return; }
      const idx = productionTasks.findIndex(t => t.id === detailTaskId);
      if (idx !== -1) productionTasks[idx] = data;
      renderKanban();
      showToast("保存しました", "success");
      closeTaskDetailModal();
    } catch (err) {
      showToast("更新エラー: " + esc(err.message), "error");
    } finally {
      btn.disabled = false;
    }
  }

  function deleteProductionTaskFromDetail() {
    if (!detailTaskId) return;
    const id = detailTaskId;
    closeTaskDetailModal();
    deleteProductionTask(id);
  }

  async function loadTaskHistory(taskId) {
    try {
      const res = await fetch(`/api/crm?action=production-task-history&production_task_id=${taskId}`);
      const history = await res.json();
      if (!res.ok) throw new Error((history && history.error) || "取得失敗");
      renderTaskHistory(Array.isArray(history) ? history : []);
    } catch (err) {
      document.getElementById("taskDetailHistory").innerHTML =
        `<p class="list-empty">履歴の取得に失敗しました: ${esc(err.message)}</p>`;
    }
  }

  function renderTaskHistory(history) {
    const el = document.getElementById("taskDetailHistory");
    if (history.length === 0) {
      el.innerHTML = '<p class="list-empty">進行履歴はまだありません</p>';
      return;
    }
    el.innerHTML = history.map(h => {
      const fromLabel = h.from_stage ? PRODUCTION_STAGE_LABELS[h.from_stage] || h.from_stage : "（新規作成）";
      const toLabel   = PRODUCTION_STAGE_LABELS[h.to_stage] || h.to_stage;
      return `
        <div class="timeline-item">
          <div class="timeline-marker stage-${h.to_stage}">🔄</div>
          <div class="timeline-content-box">
            <div class="timeline-header">
              <span class="timeline-stage-change">${esc(fromLabel)} → ${esc(toLabel)}</span>
              <span class="timeline-date">${esc(new Date(h.changed_at).toLocaleString("ja-JP"))}</span>
            </div>
            <p class="timeline-by">担当: ${esc(h.changed_by)}</p>
          </div>
        </div>`;
    }).join("");
  }

  lucide.createIcons();
  initNavMenu("production");
  initProduction();
  initScrollReveal();
</script>
</body>
</html>
