<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>企業リスト - LOCLE営業ツール</title>
<script>
  (function() {
    try {
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved ? saved === "dark" : prefersDark) document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-500: #44B13F; --green-700: #2F8A2A;
    --green-50: #f0faf0;  --green-100: #d8f0d8; --green-200: #b7e4b0;
    --gray-50: #f8fafc;   --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;  --gray-300: #cbd5e1;
    --gray-400: #94a3b8;  --gray-500: #64748b;
    --gray-700: #334155;  --gray-900: #0f172a;
    --white: #ffffff;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
    --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter","Noto Sans JP",sans-serif; background: var(--gray-50); margin: 0; color: var(--gray-900); }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .container { animation: fadeInUp 0.4s ease-out; }
  .spinner {
    display: inline-block; width: 13px; height: 13px;
    border: 2px solid var(--gray-200); border-top-color: var(--green-500);
    border-radius: 50%; animation: spin 0.6s linear infinite;
    vertical-align: middle; margin-right: 4px;
  }

  .page-header {
    background: linear-gradient(135deg, #2F8A2A 0%, #44B13F 50%, #5BC952 100%);
    border-bottom: none; box-shadow: 0 2px 8px rgba(47,138,42,0.3);
    padding: 0 24px; display: flex; align-items: center; gap: 16px;
    height: 56px; position: sticky; top: 0; z-index: 100;
  }
  .page-header h1 {
    margin: 0; font-size: 15px; font-weight: 700; color: var(--white);
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  }
  .page-header h1 svg { width: 18px; height: 18px; }
  .page-nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
  .page-nav a {
    color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 500;
    text-decoration: none; white-space: nowrap;
    padding: 6px 10px; border-radius: var(--radius-sm); transition: all 150ms;
  }
  .page-nav a:hover { color: white; background: rgba(255,255,255,0.15); }
  .page-nav a.active {
    color: white; font-weight: 600;
    background: rgba(255,255,255,0.15); border-bottom: 2px solid white; padding-bottom: 4px;
  }

  .container { max-width: 1080px; margin: 0 auto; padding: 24px 16px; }

  /* Summary bar */
  .summary-bar {
    display: flex; gap: 24px; padding: 14px 20px; margin-bottom: 20px;
    background: var(--white); border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    font-size: 13px; color: var(--gray-500); flex-wrap: wrap;
    position: relative; overflow: hidden;
  }
  .summary-bar::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #44B13F, #5BC952);
  }
  .summary-item { display: flex; flex-direction: column; gap: 2px; }
  .summary-item strong { color: var(--green-700); font-size: 18px; font-weight: 700; display: block; }
  .summary-item span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; color: var(--gray-400); }

  /* Sections */
  .add-section, .import-section, .discover-section {
    background: var(--white); border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg); padding: 20px 24px;
    margin-bottom: 20px; box-shadow: var(--shadow-sm);
  }
  .add-section h2, .import-section h2, .discover-section h2 {
    margin: 0 0 14px; font-size: 14px; font-weight: 600; color: var(--gray-700);
  }

  /* Inputs */
  input[type="text"], input[type="url"], input[type="email"] {
    padding: 8px 12px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
    background: var(--white); color: var(--gray-900); transition: border-color 150ms;
  }
  input[type="text"]:focus, input[type="url"]:focus, input[type="email"]:focus {
    outline: none; border-color: var(--green-500); box-shadow: 0 0 0 3px var(--green-100);
  }

  .add-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .add-row input[name="name"]  { flex: 0 0 200px; }
  .add-row input[name="url"]   { flex: 1 1 220px; }
  .add-row input[name="email"] { flex: 1 1 180px; }

  .btn-primary {
    padding: 8px 16px;
    background: linear-gradient(135deg, #44B13F, #2F8A2A);
    box-shadow: 0 4px 12px rgba(68,177,63,0.3);
    color: var(--white); border: none; border-radius: var(--radius-sm);
    cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit;
    transition: all 150ms ease; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary:hover:not(:disabled) {
    background: linear-gradient(135deg, #3da038, #277025);
    transform: translateY(-1px); box-shadow: 0 6px 16px rgba(68,177,63,0.4);
  }
  .btn-primary:disabled { background: var(--gray-300); box-shadow: none; cursor: not-allowed; transform: none; }
  .btn-primary svg { width: 13px; height: 13px; }

  .add-msg { margin-top: 8px; font-size: 13px; min-height: 18px; }
  .add-msg.error { color: #dc2626; }
  .add-msg.ok    { color: var(--green-700); }

  .import-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .import-format { font-size: 11px; color: var(--gray-400); margin: 8px 0 0; }
  .import-msg { margin-top: 8px; font-size: 13px; min-height: 18px; }
  .import-msg.ok    { color: var(--green-700); }
  .import-msg.error { color: #dc2626; }

  /* Table section */
  .table-section {
    background: var(--white); border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden;
  }
  .bulk-toolbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--gray-200);
  }
  .bulk-toolbar h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--gray-700); flex: 1; }
  .btn-bulk {
    padding: 7px 14px; font-size: 13px; border-radius: var(--radius-sm);
    background: linear-gradient(135deg, #44B13F, #2F8A2A);
    box-shadow: 0 4px 12px rgba(68,177,63,0.3);
    color: var(--white); border: none; cursor: pointer;
    font-family: inherit; font-weight: 600; white-space: nowrap;
    transition: all 150ms ease;
  }
  .btn-bulk:hover:not(:disabled) {
    background: linear-gradient(135deg, #3da038, #277025);
    transform: translateY(-1px); box-shadow: 0 6px 16px rgba(68,177,63,0.4);
  }
  .btn-bulk:disabled { background: var(--gray-300); box-shadow: none; cursor: not-allowed; transform: none; }
  .bulk-progress { font-size: 12px; color: var(--gray-500); }

  /* Filter bar */
  .filter-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--gray-200); background: var(--gray-50);
  }
  .filter-bar input[type="text"] { flex: 1 1 220px; }
  .filter-bar select {
    padding: 8px 10px; font-size: 13px; font-family: inherit;
    border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
    background: var(--white); color: var(--gray-900);
  }
  .filter-bar select:focus { outline: none; border-color: var(--green-500); box-shadow: 0 0 0 3px var(--green-100); }
  .btn-filter-clear {
    padding: 7px 14px; font-size: 13px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); background: var(--white); color: var(--gray-500);
    cursor: pointer; font-family: inherit; transition: all 150ms;
  }
  .btn-filter-clear:hover { background: var(--gray-100); color: var(--gray-900); }
  .filter-count { font-size: 12px; color: var(--gray-400); white-space: nowrap; margin-left: auto; }

  /* Priority column */
  th.th-priority { cursor: pointer; user-select: none; }
  th.th-priority:hover { color: var(--gray-700); }
  .priority-stars { color: var(--green-500); font-size: 13px; letter-spacing: 1px; }
  .priority-stars.none { color: var(--gray-300); font-size: 12px; letter-spacing: normal; }
  .btn-priority {
    padding: 2px 6px; font-size: 11px; border-radius: 4px;
    border: 1px solid var(--gray-200); background: var(--white); color: var(--gray-500);
    cursor: pointer; font-family: inherit; line-height: 1; transition: all 150ms;
  }
  .btn-priority:hover:not(:disabled) { background: var(--green-50); border-color: var(--green-500); color: var(--green-700); }
  .btn-priority:disabled { color: var(--gray-200); cursor: not-allowed; }

  /* Pagination */
  .pagination {
    display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap;
    padding: 16px 20px; border-top: 1px solid var(--gray-200);
  }
  .btn-page {
    min-width: 30px; padding: 6px 10px; font-size: 13px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); background: var(--white); color: var(--gray-700);
    cursor: pointer; font-family: inherit; transition: all 150ms;
  }
  .btn-page:hover:not(:disabled):not(.active) { background: var(--gray-50); }
  .btn-page.active { background: var(--green-500); border-color: var(--green-500); color: var(--white); font-weight: 600; }
  .btn-page:disabled { color: var(--gray-300); cursor: not-allowed; }
  .page-ellipsis { color: var(--gray-400); font-size: 13px; padding: 0 4px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: var(--gray-50); text-align: left; padding: 10px 14px;
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--gray-500);
    border-bottom: 2px solid var(--gray-200); white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid var(--gray-100); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover td { background: var(--green-50); transition: background 100ms ease; }
  td { padding: 10px 14px; vertical-align: middle; color: var(--gray-700); }
  td.url a { color: #2563eb; word-break: break-all; font-size: 12px; }
  td.name { font-weight: 500; color: var(--gray-900); }
  .empty-row td { text-align: center; color: var(--gray-400); padding: 32px; }

  /* Badges */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge-pending    { background: var(--gray-100); color: var(--gray-500); }
  .badge-researching{ background: #ede9fe; color: #6d28d9; }
  .badge-researched { background: var(--green-50); color: var(--green-700); }
  .badge-no_form    { background: #fff7ed; color: #c2410c; }
  .badge-captcha    { background: #fffbeb; color: #b45309; }
  .badge-error      { background: #fff5f5; color: #dc2626; }
  .badge-ok         { background: var(--green-50); color: var(--green-700); }
  .badge-ng         { background: #fff5f5; color: #dc2626; }

  /* Action buttons */
  .btn-research {
    padding: 5px 10px; font-size: 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--green-500); color: var(--green-700);
    background: var(--white); cursor: pointer; font-family: inherit;
    transition: all 150ms ease;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-research:hover:not(:disabled) { background: var(--green-500); color: var(--white); transform: translateY(-1px); }
  .btn-research:disabled { border-color: var(--gray-200); color: var(--gray-400); cursor: not-allowed; transform: none; }
  .btn-research svg { width: 12px; height: 12px; }

  .btn-detail {
    margin-left: 6px; padding: 5px 10px; font-size: 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); color: var(--gray-500); background: var(--white);
    cursor: pointer; font-family: inherit; transition: all 150ms ease;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-detail:hover { background: var(--gray-50); color: var(--gray-900); transform: translateY(-1px); }
  .btn-detail svg { width: 12px; height: 12px; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 1000;
    align-items: center; justify-content: center; padding: 16px;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--white); border-radius: var(--radius-lg); max-width: 760px; width: 100%;
    max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--gray-200);
  }
  .modal-header h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--gray-900); }
  .modal-close {
    background: none; border: none; font-size: 18px; cursor: pointer;
    color: var(--gray-400); line-height: 1; padding: 4px 8px; border-radius: var(--radius-sm);
    transition: all 150ms;
  }
  .modal-close:hover { color: var(--gray-700); background: var(--gray-100); }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

  .info-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; margin-bottom: 20px; }
  .info-grid dt { font-weight: 600; color: var(--gray-500); white-space: nowrap; }
  .info-grid dd { margin: 0; color: var(--gray-700); }
  .info-grid dd a { color: #2563eb; word-break: break-all; }

  .fields-title { font-size: 13px; font-weight: 600; color: var(--gray-700); margin: 0 0 10px; }
  .fields-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .fields-table th {
    background: var(--gray-50); padding: 7px 10px; text-align: left;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--gray-500); border-bottom: 2px solid var(--gray-200);
  }
  .fields-table td { padding: 6px 10px; border-bottom: 1px solid var(--gray-100); color: var(--gray-700); }
  .fields-table tr:last-child td { border-bottom: none; }
  .conf-high   { color: var(--green-700); font-weight: 600; }
  .conf-medium { color: #c2410c; }
  .conf-low    { color: var(--gray-400); }

  .source-label {
    display: inline-block; margin-left: 8px; padding: 1px 7px;
    border-radius: 4px; font-size: 11px; color: white; vertical-align: middle;
  }
  .source-ai        { background: #6366f1; }
  .source-heuristic { background: var(--gray-500); }

  .discover-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .discover-row input { flex: 1 1 160px; }
  .badge-places { flex-shrink: 0; display: inline-block; padding: 1px 6px; background: #4285f4; color: white; font-size: 10px; border-radius: 3px; white-space: nowrap; }
  .discover-unconfigured { margin-top: 14px; padding: 12px 16px; background: var(--gray-50); border-left: 3px solid var(--gray-300); border-radius: var(--radius-sm); font-size: 13px; color: var(--gray-500); }
  .discover-status { margin-top: 12px; font-size: 13px; color: var(--gray-400); }
  .discover-error  { margin-top: 12px; font-size: 13px; color: #dc2626; }
  .discover-count  { margin: 12px 0 8px; font-size: 13px; color: var(--gray-700); font-weight: 500; }
  .discover-list { list-style: none; margin: 0 0 14px; padding: 0; border: 1px solid var(--gray-200); border-radius: var(--radius-md); overflow: hidden; }
  .discover-list li { border-bottom: 1px solid var(--gray-100); }
  .discover-list li:last-child { border-bottom: none; }
  .discover-list label { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; font-size: 13px; transition: background 150ms; }
  .discover-list label:hover { background: var(--gray-50); }
  .discover-list input[type="checkbox"] { flex-shrink: 0; width: 15px; height: 15px; cursor: pointer; }
  .discover-name { font-weight: 500; flex-shrink: 0; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--gray-900); }
  .discover-url  { color: #2563eb; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-decoration: none; }
  .discover-url:hover { text-decoration: underline; }
  .btn-add-selected {
    padding: 8px 16px; font-size: 13px; border-radius: var(--radius-sm);
    background: linear-gradient(135deg, #44B13F, #2F8A2A);
    box-shadow: 0 4px 12px rgba(68,177,63,0.3);
    color: var(--white); border: none; cursor: pointer;
    font-family: inherit; font-weight: 600; transition: all 150ms ease;
  }
  .btn-add-selected:hover:not(:disabled) { background: linear-gradient(135deg, #3da038, #277025); transform: translateY(-1px); }
  .btn-add-selected:disabled { background: var(--gray-300); box-shadow: none; cursor: not-allowed; transform: none; }
  .add-selected-progress { margin-left: 12px; font-size: 13px; color: var(--gray-500); }

  /* Tooltip */
  .tooltip-wrap { position: relative; display: inline-block; }
  .tooltip-wrap .tooltip-text {
    visibility: hidden; opacity: 0;
    background: var(--gray-900); color: white;
    font-size: 11px; padding: 4px 8px; border-radius: 4px;
    position: absolute; bottom: calc(100% + 6px); left: 50%;
    transform: translateX(-50%); white-space: nowrap;
    transition: opacity 150ms; z-index: 100; pointer-events: none;
  }
  .tooltip-wrap:hover .tooltip-text { visibility: visible; opacity: 1; }

  /* Spotlight Tour */
  .tour-overlay {
    position: fixed;
    inset: 0;
    z-index: 9998;
    background: transparent;
  }
  .tour-highlight {
    position: relative;
    z-index: 9999 !important;
    box-shadow: 0 0 0 4px var(--green-500), 0 0 0 9999px rgba(0,0,0,0.5) !important;
    border-radius: 8px;
    transition: box-shadow 0.3s ease;
  }
  .tour-bubble {
    position: fixed;
    z-index: 10000;
    background: white;
    border-radius: 12px;
    padding: 20px 24px;
    min-width: 280px;
    max-width: 340px;
    width: calc(100vw - 32px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    animation: tourFadeInUp 0.3s ease;
  }
  @keyframes tourFadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .tour-bubble::before {
    content: "";
    position: absolute;
    width: 0; height: 0;
    border: 8px solid transparent;
  }
  .tour-bubble.pos-bottom::before { top: -16px; left: 24px; border-bottom-color: white; }
  .tour-bubble.pos-top::before    { bottom: -16px; left: 24px; border-top-color: white; }
  .tour-bubble.pos-center::before { display: none; }
  .tour-bubble-dots { display: flex; gap: 6px; margin: 0 0 12px; }
  .tour-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gray-200); transition: all 0.2s ease; }
  .tour-dot.active { background: var(--green-500); width: 16px; border-radius: 3px; }
  .tour-bubble-title { font-size: 15px; font-weight: 700; color: var(--green-700); margin: 0 0 8px; }
  .tour-bubble-desc  { font-size: 13px; color: var(--gray-500); line-height: 1.7; margin: 0 0 16px; }
  .tour-bubble-nav   { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tour-bubble-counter { font-size: 11px; color: var(--gray-400); font-weight: 600; }
  .btn-tskip {
    padding: 6px 12px; font-size: 12px; border: 1px solid var(--gray-200);
    background: white; color: var(--gray-500); border-radius: var(--radius-sm);
    cursor: pointer; font-family: inherit;
  }
  .btn-tnext {
    padding: 10px 24px; font-size: 14px; font-weight: 600;
    background: linear-gradient(135deg, #44B13F, #2F8A2A);
    color: white; border: none; border-radius: var(--radius-sm);
    cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 8px rgba(68,177,63,0.3);
  }
  .btn-help-float {
    position: fixed; bottom: 24px; right: 24px; z-index: 500;
    padding: 10px 18px; font-size: 13px; font-weight: 600;
    background: white; color: var(--green-700);
    border: 2px solid var(--green-500); border-radius: 999px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    transition: all 150ms; display: flex; align-items: center; gap: 6px;
  }
  .btn-help-float:hover { background: var(--green-50); transform: translateY(-2px); }

  @media (max-width: 600px) {
    .page-header { padding: 0 12px; }
    .page-nav { overflow-x: auto; padding-bottom: 2px; }
    .page-header h1 { font-size: 16px; }
    .btn-theme-toggle { width: 24px; height: 24px; font-size: 12px; }
    .toast-container { top: auto; bottom: 16px; right: 8px; left: 8px; max-width: 100%; }
    .container { padding: 16px 8px; }
    .add-row { flex-direction: column; }
    .add-row input[name="name"],
    .add-row input[name="url"],
    .add-row input[name="email"] { flex: none; width: 100%; font-size: 16px; }
    .add-row .btn-primary { min-height: 44px; width: 100%; justify-content: center; }
    .discover-row { flex-direction: column; }
    .discover-row input { width: 100%; font-size: 16px; }
    .discover-row .btn-primary { min-height: 44px; width: 100%; justify-content: center; }
    .import-row { flex-direction: column; }
    .import-row .btn-primary { min-height: 44px; width: 100%; justify-content: center; }
    table th:nth-child(2), table td:nth-child(2),
    table th:nth-child(3), table td:nth-child(3),
    table th:nth-child(5), table td:nth-child(5),
    table th:nth-child(6), table td:nth-child(6),
    table th:nth-child(7), table td:nth-child(7) { display: none; }
    .btn-bulk { min-height: 44px; width: 100%; }
    .btn-research { display: flex; width: 100%; margin-bottom: 4px; min-height: 44px; justify-content: center; }
    .btn-detail   { display: flex; width: 100%; margin-left: 0; min-height: 44px; justify-content: center; }
    .filter-bar { flex-direction: row; flex-wrap: wrap; align-items: stretch; }
    .filter-bar input[type="text"] { flex: 1 1 100%; font-size: 16px; }
    .filter-bar select { flex: 1 1 calc(50% - 5px); font-size: 16px; }
    .filter-bar .btn-filter-clear { flex: 1 1 100%; }
    .filter-count { flex: 1 1 100%; margin-left: 0; text-align: center; }
  }

  /* Toast notifications */
  .toast-container {
    position: fixed; top: 72px; right: 16px; z-index: 9999;
    display: flex; flex-direction: column; gap: 8px; max-width: 360px;
  }
  .toast {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow-lg);
    font-size: 13px; line-height: 1.5; animation: slideInRight 0.3s ease;
    pointer-events: auto;
  }
  .toast.success { background: #f0faf0; border: 1px solid var(--green-200); color: var(--green-700); }
  .toast.error   { background: #fff5f5; border: 1px solid #fca5a5; color: #dc2626; }
  .toast.warning { background: #fffbeb; border: 1px solid #fcd34d; color: #b45309; }
  .toast.info    { background: #eff6ff; border: 1px solid #93c5fd; color: #1d4ed8; }
  .toast-icon { flex-shrink: 0; font-size: 15px; }
  .toast-body { flex: 1; }
  .toast-title { font-weight: 600; margin-bottom: 2px; }
  .toast-close { background: none; border: none; cursor: pointer; opacity: 0.5; font-size: 16px; padding: 0 0 0 8px; }
  .toast-close:hover { opacity: 1; }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* Dark mode toggle */
  .btn-theme-toggle {
    background: rgba(255,255,255,0.15); border: none; color: white;
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    transition: background 150ms; flex-shrink: 0; margin-left: 6px;
  }
  .btn-theme-toggle:hover { background: rgba(255,255,255,0.28); }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    :root {
      --gray-50:  #0f172a;
      --gray-100: #1e293b;
      --gray-200: #334155;
      --gray-300: #475569;
      --gray-400: #64748b;
      --gray-500: #94a3b8;
      --gray-700: #cbd5e1;
      --gray-900: #f1f5f9;
      --white:    #1e293b;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.3);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.4);
    }
    body { background: #0f172a; }
    .page-header { border-bottom-color: #334155; }
    input, textarea, select {
      background: #1e293b !important;
      color: #f1f5f9 !important;
      border-color: #334155 !important;
    }
    input::placeholder, textarea::placeholder { color: #475569 !important; }
    table thead { background: #1e293b; }
    .modal-box, .tour-bubble { background: #1e293b; color: #f1f5f9; }
    .preview-subject, .preview-body-text { background: #0f172a; }
  }
  html.dark {
    --gray-50:  #0f172a;
    --gray-100: #1e293b;
    --gray-200: #334155;
    --gray-300: #475569;
    --gray-400: #64748b;
    --gray-500: #94a3b8;
    --gray-700: #cbd5e1;
    --gray-900: #f1f5f9;
    --white:    #1e293b;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 6px rgba(0,0,0,0.3);
    --shadow-lg: 0 10px 15px rgba(0,0,0,0.4);
  }
  html.dark body { background: #0f172a; }
  html.dark .page-header { border-bottom-color: #334155; }
  html.dark input, html.dark textarea, html.dark select {
    background: #1e293b !important;
    color: #f1f5f9 !important;
    border-color: #334155 !important;
  }
  html.dark input::placeholder, html.dark textarea::placeholder { color: #475569 !important; }
  html.dark table thead { background: #1e293b; }
  html.dark .modal-box, html.dark .tour-bubble { background: #1e293b; color: #f1f5f9; }
  html.dark .preview-subject, html.dark .preview-body-text { background: #0f172a; }
</style>

<body>

<header class="page-header">
  <h1><a href="/index.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
    <img src="/logo.jpg" alt="LOCLE" style="height:28px; width:auto; object-fit:contain; background:white; padding:3px 8px; border-radius:6px;">
  </a></h1>
  <nav class="page-nav">
    <a href="/index.html">ホーム</a>
    <a href="/companies.html" class="active">企業リスト</a>
    <a href="/variants.html">メッセージ管理</a>
    <a href="/send.html">送信管理</a>
    <a href="/analytics.html">分析</a>
    <a href="/help.html">ヘルプ</a>
    <button class="btn-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="ダークモード切替" title="ダークモード切替">🌙</button>
  </nav>
</header>

<div class="container">

  <div class="summary-bar" id="summaryBar" hidden></div>

  <section class="discover-section">
    <h2>企業を自動検索</h2>
    <div class="discover-row">
      <input type="text" id="discoverRegion"  placeholder="例: 群馬県" />
      <input type="text" id="discoverKeyword" placeholder="例: IT企業、Web制作" />
      <button class="btn-primary" id="discoverBtn" onclick="discoverCompanies()">
        <i data-lucide="search"></i>検索
      </button>
    </div>
    <div id="discoverResult"></div>
  </section>

  <section class="add-section">
    <h2>企業を追加</h2>
    <div class="add-row">
      <input type="text" name="name" id="inputName" placeholder="企業名" />
      <input type="url"   name="url"   id="inputUrl"   placeholder="https://example.co.jp" />
      <input type="email" name="email" id="inputEmail" placeholder="メールアドレス（任意）" />
      <button class="btn-primary" id="addBtn" onclick="addCompany()">
        <i data-lucide="plus"></i>追加
      </button>
    </div>
    <div class="add-msg" id="addMsg"></div>
  </section>

  <section class="import-section">
    <h2>CSVで一括インポート</h2>
    <div class="import-row">
      <input type="file" id="csvFile" accept=".csv" />
      <button class="btn-primary" id="importBtn" onclick="importCSV()">
        <i data-lucide="upload"></i>インポート
      </button>
    </div>
    <p class="import-format">形式: 1行目ヘッダー（name,url,email）、email列は任意。既存URLと重複する行はスキップ。</p>
    <div class="import-msg" id="importMsg"></div>
  </section>

  <section class="table-section">
    <div class="bulk-toolbar">
      <h2>登録企業一覧</h2>
      <span class="tooltip-wrap">
        <button class="btn-bulk" id="bulkBtn" onclick="bulkResearch()">未リサーチを一括リサーチ</button>
        <span class="tooltip-text">未リサーチの企業を順番に自動解析します</span>
      </span>
      <span class="bulk-progress" id="bulkProgress"></span>
    </div>
    <div class="filter-bar">
      <input type="text" id="filterSearch" placeholder="企業名・URLで検索" oninput="onFilterChange()" />
      <select id="filterStatus" onchange="onFilterChange()">
        <option value="all">ステータス: すべて</option>
        <option value="pending">未リサーチ</option>
        <option value="researched">完了</option>
        <option value="captcha_blocked">CAPTCHA</option>
        <option value="no_form">フォームなし</option>
        <option value="error">エラー</option>
      </select>
      <select id="filterAutomation" onchange="onFilterChange()">
        <option value="all">自動化: すべて</option>
        <option value="ok">自動化OK</option>
        <option value="ng">自動化NG</option>
      </select>
      <button class="btn-filter-clear" onclick="clearFilters()">クリア</button>
      <span class="filter-count" id="filterCount"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>企業名</th><th>URL</th><th>メール</th>
            <th>ステータス</th><th>自動化</th>
            <th class="th-priority" id="thPriority" onclick="toggleSortPriority()">優先度<span id="prioritySortArrow"></span></th>
            <th>更新日時</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td colspan="8">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </section>

</div>

<!-- モーダル -->
<div class="modal-overlay" id="modal" onclick="closeModalOnOverlay(event)">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">リサーチ結果</h3>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<button class="btn-help-float" id="helpFloatBtn">？ 使い方</button>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  let companies = [];
  let isBulkResearching = false;
  let filters = { search: "", status: "all", automation: "all" };
  let sortState = { field: null, dir: "desc" };
  let currentPage = 1;
  const PAGE_SIZE = 20;

  loadCompanies();

  async function loadCompanies() {
    try {
      const res = await fetch("/api/companies");
      companies = await res.json();
      renderTable();
      updateSummaryBar();
    } catch (err) {
      document.getElementById("tableBody").innerHTML =
        `<tr class="empty-row"><td colspan="8">読み込みエラー: ${esc(err.message)}</td></tr>`;
    }
  }

  function updateSummaryBar() {
    const el = document.getElementById("summaryBar");
    if (!el) return;
    const total = companies.length;
    const automatable = companies.filter(c => c.research_result?.automatable === true).length;
    if (total === 0) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = `
      <div class="summary-item"><strong>${total}</strong><span>登録企業数</span></div>
      <div class="summary-item"><strong>${automatable}</strong><span>自動化可能</span></div>
      <div class="summary-item"><strong>${companies.filter(c => c.status === "pending").length}</strong><span>未リサーチ</span></div>`;
  }

  function getFilteredCompanies() {
    return companies.filter(c => {
      if (filters.search) {
        const q = filters.search.toLowerCase();
        const matchesName = (c.name || "").toLowerCase().includes(q);
        const matchesUrl  = (c.url  || "").toLowerCase().includes(q);
        if (!matchesName && !matchesUrl) return false;
      }
      if (filters.status !== "all" && c.status !== filters.status) return false;
      if (filters.automation === "ok" && c.research_result?.automatable !== true) return false;
      if (filters.automation === "ng" && c.research_result?.automatable !== false) return false;
      return true;
    });
  }

  function getSortedCompanies(list) {
    if (sortState.field !== "priority") return list;
    return [...list].sort((a, b) => {
      const pa = a.priority || 0, pb = b.priority || 0;
      return sortState.dir === "desc" ? pb - pa : pa - pb;
    });
  }

  function onFilterChange() {
    filters.search      = document.getElementById("filterSearch").value.trim();
    filters.status      = document.getElementById("filterStatus").value;
    filters.automation  = document.getElementById("filterAutomation").value;
    currentPage = 1;
    renderTable();
  }

  function clearFilters() {
    document.getElementById("filterSearch").value = "";
    document.getElementById("filterStatus").value = "all";
    document.getElementById("filterAutomation").value = "all";
    filters = { search: "", status: "all", automation: "all" };
    currentPage = 1;
    renderTable();
  }

  function updateFilterCount(filteredCount) {
    const el = document.getElementById("filterCount");
    if (!el) return;
    const isFiltering = filters.search || filters.status !== "all" || filters.automation !== "all";
    el.textContent = isFiltering ? `${companies.length}社中${filteredCount}社を表示中` : "";
  }

  function toggleSortPriority() {
    if (sortState.field !== "priority") {
      sortState = { field: "priority", dir: "desc" };
    } else {
      sortState.dir = sortState.dir === "desc" ? "asc" : "desc";
    }
    currentPage = 1;
    renderTable();
  }

  function priorityLabel(p) {
    const n = Math.max(0, Math.min(3, p || 0));
    return n === 0
      ? '<span class="priority-stars none">なし</span>'
      : `<span class="priority-stars">${"★".repeat(n)}</span>`;
  }

  async function changePriority(id, delta) {
    const company = companies.find(c => c.id === id);
    if (!company) return;
    const current = company.priority || 0;
    const newPriority = Math.max(0, Math.min(3, current + delta));
    if (newPriority === current) return;
    try {
      const res = await fetch("/api/companies", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, priority: newPriority }),
      });
      const data = await res.json();
      if (!res.ok) { showToast(esc(data.error || "優先度の更新に失敗しました"), "error"); return; }
      company.priority = data.priority;
      renderTable();
    } catch (err) {
      showToast("優先度の更新に失敗しました: " + esc(err.message), "error");
    }
  }

  function renderPagination(totalItems, totalPages) {
    const el = document.getElementById("pagination");
    if (!el) return;
    if (totalItems <= PAGE_SIZE) { el.innerHTML = ""; return; }

    const pages = [];
    for (let p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 1) {
        pages.push(p);
      } else if (pages[pages.length - 1] !== "...") {
        pages.push("...");
      }
    }

    let html = `<button class="btn-page" onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>← 前へ</button>`;
    html += pages.map(p => p === "..."
      ? `<span class="page-ellipsis">...</span>`
      : `<button class="btn-page ${p === currentPage ? "active" : ""}" onclick="goToPage(${p})">${p}</button>`
    ).join("");
    html += `<button class="btn-page" onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>次へ →</button>`;
    el.innerHTML = html;
  }

  function goToPage(p) {
    if (p < 1) return;
    currentPage = p;
    renderTable();
    document.querySelector(".table-section").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function renderTable() {
    const tbody = document.getElementById("tableBody");
    const arrowEl = document.getElementById("prioritySortArrow");
    if (arrowEl) {
      arrowEl.textContent = sortState.field === "priority" ? (sortState.dir === "desc" ? " ▼" : " ▲") : "";
    }

    if (!companies.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="8">企業が登録されていません</td></tr>';
      updateSummaryBar();
      updateFilterCount(0);
      renderPagination(0, 1);
      return;
    }

    const filtered = getFilteredCompanies();
    const sorted    = getSortedCompanies(filtered);
    updateFilterCount(filtered.length);

    const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    if (!sorted.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="8">条件に一致する企業がありません</td></tr>';
      updateSummaryBar();
      renderPagination(sorted.length, totalPages);
      return;
    }

    const pageItems = sorted.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

    tbody.innerHTML = pageItems.map(c => {
      const result = c.research_result;
      const updatedAt = c.updated_at
        ? new Date(c.updated_at).toLocaleString("ja-JP", { month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" })
        : "—";
      const isResearching = c.status === "researching";
      const btnDisabled = isBulkResearching || isResearching;
      const researchLabel = isResearching
        ? '<span class="spinner"></span>リサーチ中...'
        : '<i data-lucide="search"></i>リサーチする';
      const detailBtn = result && !result.error && !isResearching
        ? `<button class="btn-detail" onclick="showDetail(${c.id})"><i data-lucide="eye"></i> 詳細</button>`
        : "";
      const priority = c.priority || 0;
      return `
        <tr id="row-${c.id}">
          <td class="name">${esc(c.name)}</td>
          <td class="url"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a></td>
          <td style="font-size:12px">${c.email ? `<a href="mailto:${esc(c.email)}" style="color:#2563eb">${esc(c.email)}</a>` : '<span style="color:var(--gray-300)">—</span>'}</td>
          <td>${statusBadge(c.status)}</td>
          <td>${automatableBadge(result)}</td>
          <td style="white-space:nowrap">
            ${priorityLabel(priority)}
            <button class="btn-priority" onclick="changePriority(${c.id}, 1)" ${priority >= 3 ? "disabled" : ""} title="優先度を上げる">▲</button>
            <button class="btn-priority" onclick="changePriority(${c.id}, -1)" ${priority <= 0 ? "disabled" : ""} title="優先度を下げる">▼</button>
          </td>
          <td style="white-space:nowrap;font-size:12px;color:var(--gray-400)">${updatedAt}</td>
          <td style="white-space:nowrap">
            <span class="tooltip-wrap"><button class="btn-research" id="rbtn-${c.id}" onclick="research(${c.id})" ${btnDisabled ? "disabled" : ""}>${researchLabel}</button><span class="tooltip-text">企業サイトのフォームを自動解析します</span></span>
            ${detailBtn}
          </td>
        </tr>`;
    }).join("");
    updateSummaryBar();
    renderPagination(sorted.length, totalPages);
    lucide.createIcons();
  }

  async function callResearchAPI(id) {
    const res = await fetch(`/api/companies/${id}/research`, { method: "POST" });
    const data = await res.json();
    return { ok: res.ok, data };
  }

  function updateCompany(updated) {
    const idx = companies.findIndex(c => c.id === updated.id);
    if (idx !== -1) companies[idx] = updated;
    renderTable();
  }

  async function addCompany() {
    const name  = document.getElementById("inputName").value.trim();
    const url   = document.getElementById("inputUrl").value.trim();
    const email = document.getElementById("inputEmail").value.trim();
    const btn   = document.getElementById("addBtn");

    if (!name) { showMsg("企業名を入力してください", "error"); return; }
    if (!url)  { showMsg("URLを入力してください", "error"); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>登録中...';
    showMsg("登録中...", "");

    let newCompany;
    try {
      const res = await fetch("/api/companies", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, url, email: email || null }),
      });
      const data = await res.json();
      if (!res.ok) { showToast(esc(data.error || "登録エラー"), "error"); btn.disabled = false; btn.innerHTML = '<i data-lucide="plus"></i>追加'; lucide.createIcons(); return; }
      newCompany = data;
      document.getElementById("inputName").value  = "";
      document.getElementById("inputUrl").value   = "";
      document.getElementById("inputEmail").value = "";
    } catch (err) {
      showToast(esc(err.message), "error");
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="plus"></i>追加';
      lucide.createIcons();
      return;
    }

    companies.unshift({ ...newCompany, status: "researching" });
    renderTable();
    showMsg("登録しました。リサーチ中...", "");

    try {
      const { ok, data: updated } = await callResearchAPI(newCompany.id);
      updateCompany(updated);
      if (ok) {
        showMsg("登録・リサーチ完了", "ok");
        showToast("登録・リサーチが完了しました", "success");
      } else {
        const errMsg = `リサーチエラー: ${updated.research_result?.error || updated.error || "不明"}`;
        showMsg(errMsg, "error");
        showToast(esc(errMsg), "error");
      }
    } catch (err) {
      const idx = companies.findIndex(c => c.id === newCompany.id);
      if (idx !== -1) companies[idx] = { ...newCompany, status: "error", research_result: { error: err.message } };
      renderTable();
      showMsg("リサーチ中にエラーが発生しました", "error");
      showToast("リサーチ中にエラーが発生しました", "error");
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="plus"></i>追加';
      lucide.createIcons();
    }
  }

  async function importCSV() {
    const fileInput = document.getElementById("csvFile");
    const btn       = document.getElementById("importBtn");
    const msgEl     = document.getElementById("importMsg");

    if (!fileInput.files || !fileInput.files[0]) {
      msgEl.textContent = "CSVファイルを選択してください";
      msgEl.className = "import-msg error";
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>インポート中...';
    msgEl.textContent = "インポート中...";
    msgEl.className = "import-msg";

    try {
      const csvText = await fileInput.files[0].text();
      const res = await fetch("/api/companies", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ csv: csvText }),
      });
      const data = await res.json();
      if (!res.ok) {
        msgEl.textContent = data.error || "インポートエラー";
        msgEl.className = "import-msg error";
        return;
      }
      msgEl.textContent = `インポート完了: ${data.imported}件追加、${data.skipped}件スキップ`;
      msgEl.className = "import-msg ok";
      fileInput.value = "";
      const listRes = await fetch("/api/companies");
      companies = await listRes.json();
      renderTable();
    } catch (err) {
      msgEl.textContent = err.message;
      msgEl.className = "import-msg error";
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="upload"></i>インポート';
      lucide.createIcons();
    }
  }

  function showMsg(text, type) {
    const el = document.getElementById("addMsg");
    el.textContent = text;
    el.className = "add-msg" + (type ? " " + type : "");
  }

  async function bulkResearch() {
    if (isBulkResearching) return;
    const pending = companies.filter(c => c.status === "pending");
    if (pending.length === 0) {
      document.getElementById("bulkProgress").textContent = "未リサーチの企業はありません";
      return;
    }
    isBulkResearching = true;
    document.getElementById("bulkBtn").disabled = true;
    renderTable();
    let success = 0, failure = 0;
    const total = pending.length;
    for (let i = 0; i < pending.length; i++) {
      const company = pending[i];
      document.getElementById("bulkProgress").textContent = `${i+1}/${total}件 処理中...(${company.name})`;
      const idx = companies.findIndex(c => c.id === company.id);
      if (idx !== -1) companies[idx] = { ...companies[idx], status: "researching" };
      renderTable();
      try {
        const { ok, data: updated } = await callResearchAPI(company.id);
        updateCompany(updated);
        if (ok && updated.status !== "error") success++; else failure++;
      } catch (err) {
        const idx2 = companies.findIndex(c => c.id === company.id);
        if (idx2 !== -1) companies[idx2] = { ...companies[idx2], status: "error", research_result: { error: err.message } };
        renderTable(); failure++;
      }
    }
    isBulkResearching = false;
    document.getElementById("bulkBtn").disabled = false;
    document.getElementById("bulkProgress").textContent = `完了（成功: ${success}件 / 失敗: ${failure}件）`;
    showToast(`一括リサーチが完了しました（成功: ${success}件 / 失敗: ${failure}件）`, "success");
    renderTable();
  }

  async function research(id) {
    if (isBulkResearching) return;
    const idx = companies.findIndex(c => c.id === id);
    if (idx !== -1) companies[idx] = { ...companies[idx], status: "researching" };
    renderTable();
    try {
      const { ok, data: updated } = await callResearchAPI(id);
      if (!ok) {
        showToast("エラー: " + esc(updated.error || "不明なエラー"), "error");
      } else {
        showToast("リサーチが完了しました", "success");
      }
      updateCompany(updated);
    } catch (err) {
      showToast("エラー: " + esc(err.message), "error");
      const idx2 = companies.findIndex(c => c.id === id);
      if (idx2 !== -1) companies[idx2] = { ...companies[idx2], status: "error" };
      renderTable();
    }
  }

  async function discoverCompanies() {
    const region   = document.getElementById("discoverRegion").value.trim();
    const keyword  = document.getElementById("discoverKeyword").value.trim();
    const btn      = document.getElementById("discoverBtn");
    const resultEl = document.getElementById("discoverResult");
    if (!region && !keyword) return;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>検索中...';
    resultEl.innerHTML = '<p class="discover-status">検索中...</p>';
    try {
      const res = await fetch("/api/discover", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ region, keyword }),
      });
      const data = await res.json();
      if (!res.ok) { resultEl.innerHTML = `<p class="discover-error">エラー: ${esc(data.error || "不明なエラー")}</p>`; return; }
      if (!data.configured) { resultEl.innerHTML = `<p class="discover-unconfigured">Brave Search APIキーの設定が必要です。</p>`; return; }
      if (!data.results || data.results.length === 0) { resultEl.innerHTML = `<p class="discover-status">検索結果が見つかりませんでした。</p>`; return; }
      resultEl.innerHTML = `
        <p class="discover-count">${data.results.length}件見つかりました</p>
        <ul class="discover-list">
          ${data.results.map((r, i) => `
            <li><label>
              <input type="checkbox" class="discover-check" data-name="${esc(r.name)}" data-url="${esc(r.url)}" checked />
              <span class="discover-name">${esc(r.name)}</span>
              ${r.source === "places" ? '<span class="badge-places">Googleマップ</span>' : ""}
              <a href="${esc(r.url)}" target="_blank" rel="noopener" class="discover-url">${esc(r.url)}</a>
            </label></li>`).join("")}
        </ul>
        <button class="btn-add-selected" id="addSelectedBtn" onclick="addSelectedCompanies()">選んだ企業を追加</button>
        <span class="add-selected-progress" id="addSelectedProgress"></span>`;
    } catch (err) {
      resultEl.innerHTML = `<p class="discover-error">エラー: ${esc(err.message)}</p>`;
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="search"></i>検索';
      lucide.createIcons();
    }
  }

  async function addSelectedCompanies() {
    const checks = Array.from(document.querySelectorAll(".discover-check:checked"));
    if (checks.length === 0) return;
    const btn = document.getElementById("addSelectedBtn");
    const progress = document.getElementById("addSelectedProgress");
    btn.disabled = true;
    const total = checks.length;
    let added = 0;
    for (let i = 0; i < checks.length; i++) {
      const check = checks[i];
      const name = check.dataset.name;
      const url  = check.dataset.url;
      progress.textContent = `${i+1}/${total}件 登録中...(${name})`;
      let newCompany;
      try {
        const res = await fetch("/api/companies", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, url }),
        });
        const data = await res.json();
        if (!res.ok) continue;
        newCompany = data;
        companies.unshift({ ...newCompany, status: "researching" });
        renderTable();
      } catch { continue; }
      progress.textContent = `${i+1}/${total}件 リサーチ中...(${name})`;
      try {
        const { data: updated } = await callResearchAPI(newCompany.id);
        updateCompany(updated);
      } catch (err) {
        const idx = companies.findIndex(c => c.id === newCompany.id);
        if (idx !== -1) companies[idx] = { ...newCompany, status: "error", research_result: { error: err.message } };
        renderTable();
      }
      added++;
    }
    progress.textContent = `完了しました（${added}件追加）`;
    btn.disabled = false;
  }

  function showDetail(id) {
    const company = companies.find(c => c.id === id);
    if (!company || !company.research_result) return;
    const r = company.research_result;
    document.getElementById("modalTitle").textContent = company.name + " のリサーチ結果";
    const sourceLabel = r.mappingSource === "ai"
      ? '<span class="source-label source-ai">AI推定</span>'
      : '<span class="source-label source-heuristic">キーワード推定</span>';
    let html = `
      <dl class="info-grid">
        <dt>フォーム</dt><dd>${r.formFound ? "あり" : "なし"}</dd>
        <dt>CAPTCHA</dt><dd>${r.captchaDetected ? "<span style='color:#dc2626'>🔒 検出</span>" : "なし"}</dd>
        <dt>自動化可否</dt><dd>${r.automatable ? '<span class="badge badge-ok">✓ OK</span>' : '<span class="badge badge-ng">✕ NG</span>'}</dd>
        <dt>フォームページ</dt><dd>${r.formPageUrl ? `<a href="${esc(r.formPageUrl)}" target="_blank" rel="noopener">${esc(r.formPageUrl)}</a>` : "—"}</dd>
        ${r.aiError ? `<dt>AI推定エラー</dt><dd style="color:#dc2626">${esc(r.aiError)}</dd>` : ""}
      </dl>`;
    if (r.fieldMapping && r.fieldMapping.length > 0) {
      const fieldMap = {};
      (r.fieldMapping || []).forEach(m => { fieldMap[`${m.formIndex}:${m.name||""}:${m.id||""}`] = m; });
      const rows = (r.forms || []).flatMap(form => form.fields.map(f => {
        const m = fieldMap[`${form.formIndex}:${f.name||""}:${f.id||""}`];
        return { label: f.label||f.placeholder||"—", nameId: [f.name,f.id].filter(Boolean).join(" / ")||"—", type: f.type, role: m?m.role:"—", confidence: m?m.confidence:"—" };
      }));
      html += `<p class="fields-title">フィールド一覧 ${sourceLabel}</p>
      <table class="fields-table">
        <thead><tr><th>ラベル</th><th>name / id</th><th>type</th><th>推定役割</th><th>信頼度</th></tr></thead>
        <tbody>${rows.map(f => `<tr><td>${esc(f.label)}</td><td style="font-family:monospace;font-size:11px">${esc(f.nameId)}</td><td>${esc(f.type)}</td><td>${esc(f.role)}</td><td class="conf-${f.confidence}">${f.confidence}</td></tr>`).join("")}</tbody>
      </table>`;
    } else {
      html += `<p style="color:var(--gray-400);font-size:13px">フィールドマッピングデータがありません。</p>`;
    }
    document.getElementById("modalBody").innerHTML = html;
    document.getElementById("modal").classList.add("open");
  }

  function closeModal() { document.getElementById("modal").classList.remove("open"); }
  function closeModalOnOverlay(e) { if (e.target === document.getElementById("modal")) closeModal(); }
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  function esc(s) {
    return String(s||"")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ===== Toast notifications =====
  function showToast(message, type = "info", duration = 4000) {
    const icons = { success: "✓", error: "✕", warning: "⚠", info: "ℹ" };
    const container = document.getElementById("toastContainer") || (() => {
      const el = document.createElement("div");
      el.id = "toastContainer";
      el.className = "toast-container";
      document.body.appendChild(el);
      return el;
    })();
    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <span class="toast-icon">${icons[type] || "ℹ"}</span>
      <span class="toast-body">${message}</span>
      <button class="toast-close" onclick="this.closest('.toast').remove()">×</button>
    `;
    container.appendChild(toast);
    if (duration > 0) setTimeout(() => toast.remove(), duration);
  }

  // ===== Dark mode toggle =====
  function toggleTheme() {
    document.documentElement.classList.toggle("dark");
    const isDark = document.documentElement.classList.contains("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    updateThemeIcon();
  }

  function updateThemeIcon() {
    const btn = document.getElementById("themeToggleBtn");
    if (!btn) return;
    btn.textContent = document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
  }

  updateThemeIcon();

  function statusBadge(status) {
    const map = {
      pending:        { label: "未リサーチ",          cls: "badge-pending" },
      researching:    { label: "<span class='spinner'></span>リサーチ中...", cls: "badge-researching" },
      researched:     { label: "✓ 完了",              cls: "badge-researched" },
      no_form:        { label: "フォームなし",         cls: "badge-no_form" },
      captcha_blocked:{ label: "🔒 CAPTCHA",          cls: "badge-captcha" },
      error:          { label: "✕ エラー",            cls: "badge-error" },
    };
    const s = map[status] || { label: status, cls: "badge-pending" };
    return `<span class="badge ${s.cls}">${s.label}</span>`;
  }

  function automatableBadge(result) {
    if (!result || result.error) return '<span style="color:var(--gray-300)">—</span>';
    return result.automatable
      ? '<span class="badge badge-ok">✓ OK</span>'
      : '<span class="badge badge-ng">✕ NG</span>';
  }

  // ===== Spotlight Tour =====
  (function() {
    var _steps, _key, _idx, _bubble, _overlay;

    function _resolveEl(sel) {
      var parts = sel.split(",");
      for (var i = 0; i < parts.length; i++) {
        var el = document.querySelector(parts[i].trim());
        if (el) return el;
      }
      return null;
    }

    function _clearHighlight() {
      document.querySelectorAll(".tour-highlight").forEach(function(el) {
        el.classList.remove("tour-highlight");
      });
      if (_bubble && _bubble.parentNode) _bubble.parentNode.removeChild(_bubble);
      _bubble = null;
      if (_overlay && _overlay.parentNode) _overlay.parentNode.removeChild(_overlay);
      _overlay = null;
    }

    function _showStep(idx) {
      _clearHighlight();
      var s = _steps[idx];
      var total = _steps.length;
      var isLast = idx === total - 1;
      var target = _resolveEl(s.targetSelector);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });

      // オーバーレイはクリックをブロックするだけで、クリックしてもツアーは終了しない
      _overlay = document.createElement("div");
      _overlay.className = "tour-overlay";
      document.body.appendChild(_overlay);

      setTimeout(function() {
        if (target) target.classList.add("tour-highlight");

        var dots = "";
        for (var d = 0; d < total; d++) {
          dots += '<span class="tour-dot' + (d === idx ? ' active' : '') + '"></span>';
        }

        _bubble = document.createElement("div");
        _bubble.className = "tour-bubble pos-" + (s.position || "bottom");
        _bubble.innerHTML =
          '<div class="tour-bubble-dots">' + dots + '</div>' +
          '<p class="tour-bubble-title">' + s.title + '</p>' +
          '<p class="tour-bubble-desc">' + s.description + '</p>' +
          '<div class="tour-bubble-nav">' +
            '<button class="btn-tskip" id="_tskip">スキップ</button>' +
            '<span class="tour-bubble-counter">' + (idx + 1) + ' / ' + total + '</span>' +
            '<button class="btn-tnext" id="_tnext">' + (isLast ? 'はじめる ✓' : '次へ →') + '</button>' +
          '</div>';
        document.body.appendChild(_bubble);

        _bubble.querySelector("#_tskip").addEventListener("click", function() { _end(); });
        _bubble.querySelector("#_tnext").addEventListener("click", function() {
          if (idx < total - 1) _showStep(idx + 1); else _end();
        });

        if (s.position === "center" || !target) {
          _bubble.className = "tour-bubble pos-center";
          _bubble.style.top = "50%"; _bubble.style.left = "50%";
          _bubble.style.transform = "translate(-50%, -50%)";
        } else {
          var rect = target.getBoundingClientRect();
          var bw = _bubble.offsetWidth || 320;
          var bh = _bubble.offsetHeight || 160;
          var margin = 12;
          var pos = s.position || "bottom";

          if (pos === "bottom" && (rect.bottom + margin + bh > window.innerHeight - 20)) {
            pos = "top";
          }
          _bubble.className = "tour-bubble pos-" + pos;

          var left = Math.max(8, Math.min(rect.left, window.innerWidth - bw - 8));

          if (pos === "bottom") {
            _bubble.style.top = (rect.bottom + margin) + "px";
            _bubble.style.left = left + "px";
          } else if (pos === "top") {
            _bubble.style.left = left + "px";
            _bubble.style.top = Math.max(8, rect.top - bh - margin) + "px";
          } else if (pos === "right") {
            _bubble.style.top = rect.top + "px";
            _bubble.style.left = (rect.right + margin) + "px";
          } else if (pos === "left") {
            _bubble.style.top = rect.top + "px";
            _bubble.style.left = (rect.left - bw - margin) + "px";
          }
        }
      }, 500);
    }

    function _end() { _clearHighlight(); localStorage.setItem(_key, "1"); }

    function startTour(steps, storageKey) {
      _steps = steps; _key = storageKey; _idx = 0;
      if (!localStorage.getItem(_key)) _showStep(0);
    }

    document.getElementById("helpFloatBtn").addEventListener("click", function() {
      localStorage.removeItem(_key); _idx = 0; _showStep(0);
    });

    window.startTour = startTour;
  })();
  // ===== End Spotlight Tour =====

  lucide.createIcons();
  startTour([
    { targetSelector: ".add-section",      title: "企業を追加する",         description: "企業名とURLを入力して追加します。追加するとすぐ自動でリサーチが始まります。CSVで一括インポートも可能です。",        position: "bottom" },
    { targetSelector: "#bulkBtn",          title: "一括リサーチ",           description: "未リサーチの企業を全社まとめて自動解析します。まとめて登録してからこのボタンを押すのがおすすめです。",              position: "bottom" },
    { targetSelector: ".table-section",    title: "リサーチ結果を確認",      description: "「自動化OK」になった企業はフォームへの自動送信が可能です。CAPTCHAありの企業は手動対応が必要です。",            position: "top" },
    { targetSelector: ".discover-section", title: "企業を自動検索（準備中）", description: "地域・業種を指定して企業を自動検索できます。現在Brave Search APIキーの設定で有効になります。", position: "top" }
  ], "locle_tour_companies");
</script>
</body>
</html>
